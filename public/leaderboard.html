<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSAUx — Live Leaderboard</title>
<style>
  :root{
    --green:#0F5A3E; --green-l:#12694a; --green-d:#062a1d; --gold:#E7C349; --gold-d:#C9A227;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  html,body{height:100%}
  body{background:radial-gradient(130% 120% at 50% -10%, #17805a 0%, var(--green) 42%, var(--green-d) 100%);color:#fff;min-height:100vh;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:-40%;background:
     radial-gradient(40% 30% at 20% 20%, rgba(231,195,73,.10), transparent 60%),
     radial-gradient(40% 30% at 80% 30%, rgba(255,255,255,.06), transparent 60%);
     animation:drift 22s ease-in-out infinite alternate;z-index:0}
  @keyframes drift{to{transform:translate3d(4%,3%,0) rotate(3deg)}}
  #confetti{position:fixed;inset:0;z-index:40;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:30px 30px 40px;min-height:100vh;display:flex;flex-direction:column}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:16px}
  .brand img{height:60px;width:auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4))}
  .brand .k{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.65);font-weight:700}
  .brand h2{font-size:34px;font-weight:900;line-height:1.02;background:linear-gradient(90deg,#fff,#ffe9a8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .livebox{display:flex;align-items:center;gap:12px}
  .live{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);padding:9px 15px;border-radius:30px;font-weight:800;font-size:14px;letter-spacing:1px}
  .dot{width:11px;height:11px;border-radius:50%;background:#54e59a;box-shadow:0 0 0 0 rgba(84,229,154,.7);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(84,229,154,.6)}70%{box-shadow:0 0 0 15px rgba(84,229,154,0)}100%{box-shadow:0 0 0 0 rgba(84,229,154,0)}}
  .fs{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .fs:hover{background:rgba(255,255,255,.2)}
  .updated{position:absolute;top:96px;right:30px;font-size:12.5px;color:rgba(255,255,255,.5);font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
  .stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:14px}
  .stat .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(231,195,73,.16)}
  .stat .v{font-size:30px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:12.5px;color:rgba(255,255,255,.62);font-weight:600;margin-top:3px}

  .podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:18px;align-items:end;margin:6px 0 24px;position:relative}
  .col{display:flex;flex-direction:column;align-items:center;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  .col:nth-child(2){animation-delay:.05s}.col:nth-child(3){animation-delay:.1s}
  .col.first .ava{box-shadow:0 0 0 5px rgba(231,195,73,.35),0 14px 40px rgba(0,0,0,.45);animation:glow 2.4s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 0 9px rgba(231,195,73,.22),0 14px 40px rgba(0,0,0,.45)}}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .crown{font-size:32px;margin-bottom:2px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .ava{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;border:4px solid rgba(255,255,255,.85);box-shadow:0 12px 34px rgba(0,0,0,.4)}
  .name{font-weight:800;margin-top:11px;font-size:20px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tier{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:20px;margin-top:5px}
  .pts{font-weight:800;font-size:16px;margin-top:5px;color:#ffe9a8;font-variant-numeric:tabular-nums}
  .stand{width:100%;border-radius:18px 18px 0 0;margin-top:13px;display:flex;align-items:flex-start;justify-content:center;color:#fff;padding-top:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
  .stand .n{font-size:46px;font-weight:900;text-shadow:0 3px 10px rgba(0,0,0,.3)}

  .list{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:8px;backdrop-filter:blur(4px)}
  .row{display:flex;align-items:center;gap:16px;padding:12px 18px;border-radius:16px}
  .row+.row{margin-top:2px}
  .row.flash{animation:flash 2.4s ease-out}
  @keyframes flash{0%{background:rgba(231,195,73,.55)}100%{background:transparent}}
  .r-rank{width:42px;text-align:center;font-weight:900;font-size:22px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
  .r-rank .m{font-size:26px}
  .r-move{width:34px;font-size:13px;font-weight:800;text-align:center}
  .up{color:#54e59a}.down{color:#ff8f8f}.same{color:rgba(255,255,255,.3)}.newp{color:var(--gold)}
  .r-ava{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;color:#fff;flex:0 0 auto;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .r-name{flex:1;min-width:0}
  .r-top{display:flex;align-items:center;gap:9px}
  .r-top b{font-size:21px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-sub{font-size:12.5px;color:rgba(255,255,255,.5);font-weight:600;margin-top:1px}
  .r-pts{font-weight:900;font-size:25px;color:#ffe9a8;font-variant-numeric:tabular-nums}
  .r-pts small{font-size:13px;color:rgba(255,255,255,.55);font-weight:700;margin-left:5px}

  footer{margin-top:auto;padding-top:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:rgba(255,255,255,.6);font-size:14px;font-weight:600}
  .qr{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px 14px}
  .qr img{width:64px;height:64px;border-radius:8px;background:#fff;padding:4px}
  .qr .t{font-size:12.5px;line-height:1.3}.qr .t b{color:#ffe9a8;font-size:13.5px}
  .state{text-align:center;padding:70px 20px;color:rgba(255,255,255,.85);font-size:19px;font-weight:700}
  .state small{display:block;margin-top:12px;font-weight:500;font-size:14px;color:rgba(255,255,255,.55);max-width:560px;margin:12px auto 0;line-height:1.5}

  #toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
  .toast{background:linear-gradient(90deg,var(--gold),var(--gold-d));color:#3a2e00;font-weight:900;font-size:18px;padding:13px 22px;border-radius:30px;box-shadow:0 12px 34px rgba(0,0,0,.35);animation:tpop .35s cubic-bezier(.2,1.3,.4,1),tout .4s ease 3.4s forwards}
  @keyframes tpop{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-14px) scale(.96)}}

  @media (max-width:720px){.stats{grid-template-columns:1fr}.brand h2{font-size:27px}.podium{gap:10px}.r-top b{font-size:18px}.r-pts{font-size:21px}.updated{display:none}footer{flex-direction:column}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="toasts"></div>
<div class="updated" id="updated"></div>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="/emblem.png" alt="PSAUx" onerror="this.style.display='none'"/>
      <div>
        <div class="k">Prince Sattam University · Sustainability</div>
        <h2>Live Leaderboard</h2>
      </div>
    </div>
    <div class="livebox">
      <div class="live"><span class="dot"></span> LIVE</div>
      <button class="fs" id="fs" title="Fullscreen">⛶</button>
    </div>
  </header>

  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="ic">👥</div><div><div class="v" id="s-players">0</div><div class="l">Eco-Heroes competing</div></div></div>
    <div class="stat"><div class="ic">⚡</div><div><div class="v" id="s-points">0</div><div class="l">Total Eco-points earned</div></div></div>
    <div class="stat"><div class="ic">🌍</div><div><div class="v" id="s-co2">0</div><div class="l">kg CO₂ avoided (est.)</div></div></div>
  </div>

  <div id="podium" class="podium" style="display:none"></div>
  <div id="list" class="list" style="display:none"></div>
  <div id="state" class="state">Connecting to the campus leaderboard…</div>

  <footer>
    <span>Earn Eco-points at any PSAUx station, in the app, and by volunteering — climb the board in real time.</span>
    <div class="qr" id="qr"></div>
  </footer>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDTZ4COIWrzmXZtC9uAsAUCNwHALOquvMM",
    authDomain: "psaux-26.firebaseapp.com", projectId: "psaux-26",
    storageBucket: "psaux-26.firebasestorage.app", messagingSenderId: "138559961961",
    appId: "1:138559961961:android:2a04b8a7e4e6af6eb21bf8"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  try { await signInAnonymously(getAuth(app)); } catch (e) {}

  const CO2_PER_POINT = 0.05, MEDALS = ["🥇","🥈","🥉"];
  const PODIUM_COLORS = ["var(--gold-d)","#9AA6A0","#B07B4F"], HEIGHTS = [175,215,140];
  let prevPoints = {}, prevRank = {}, firstLoad = true, lastUpdate = 0, prevLeader = null;

  const el = id => document.getElementById(id);
  const initial = n => ((n||"?").trim().charAt(0)||"?").toUpperCase();
  const first = n => (n||"Explorer").trim().split(" ")[0];
  const esc = s => (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = n => (n||0).toLocaleString();

  function grad(name){let h=0;const s=(name||"?");for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return `linear-gradient(135deg,hsl(${h} 62% 48%),hsl(${(h+40)%360} 62% 38%))`;}
  function tier(p){
    if(p>=10000) return {n:"Legend",e:"💎",c:"#b388ff"};
    if(p>=4000)  return {n:"Champion",e:"🏅",c:"#E7C349"};
    if(p>=1500)  return {n:"Guardian",e:"🌳",c:"#3fb984"};
    if(p>=500)   return {n:"Explorer",e:"🍃",c:"#35c7b0"};
    return {n:"Sprout",e:"🌱",c:"#7bd66a"};
  }
  function tierPill(p){const t=tier(p);return `<span class="tier" style="background:${t.c}26;color:${t.c}">${t.e} ${t.n}</span>`;}
  function animateNum(node,to){const from=parseInt((node.textContent||"0").replace(/,/g,""))||0;if(from===to){node.textContent=fmt(to);return;}const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/650);node.textContent=fmt(Math.round(from+(to-from)*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(s);})(t0);}
  function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;el("toasts").appendChild(d);setTimeout(()=>d.remove(),4000);}
  function moveBadge(uid,rank){const p=prevRank[uid];if(p==null)return firstLoad?'<span class="same">·</span>':'<span class="newp">NEW</span>';if(p>rank)return `<span class="up">▲${p-rank}</span>`;if(p<rank)return `<span class="down">▼${rank-p}</span>`;return '<span class="same">·</span>';}

  // ---- confetti ----
  const cvs=el("confetti"),ctx=cvs.getContext("2d");let parts=[],raf=null;
  function rz(){cvs.width=innerWidth;cvs.height=innerHeight;}rz();addEventListener("resize",rz);
  function burst(n=100){const cols=["#E7C349","#54e59a","#fff","#12694a","#C9A227","#b388ff"];for(let i=0;i<n;i++)parts.push({x:innerWidth*(.3+Math.random()*.4),y:-20,vx:(Math.random()-.5)*9,vy:Math.random()*4+2,g:.16,s:6+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]});if(!raf)loop();}
  function loop(){ctx.clearRect(0,0,cvs.width,cvs.height);parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);ctx.restore();});parts=parts.filter(p=>p.y<cvs.height+30);if(parts.length)raf=requestAnimationFrame(loop);else{raf=null;ctx.clearRect(0,0,cvs.width,cvs.height);}}

  function render(rows){
    el("state").style.display = rows.length?"none":"block";
    if(!rows.length){el("state").textContent="No players yet — be the first to earn Eco-points!";return;}
    el("stats").style.display="grid";el("podium").style.display="grid";el("list").style.display="block";

    if(!firstLoad){
      let earned=false;
      rows.forEach(r=>{const b=prevPoints[r.uid];if(b!=null&&r.points>b){toast(`🎉 ${first(r.name)} earned +${fmt(r.points-b)} pts!`);earned=true;}});
      if(earned) burst(90);
      if(rows[0]&&prevLeader&&rows[0].uid!==prevLeader){toast(`👑 ${first(rows[0].name)} takes the lead!`);burst(140);}
    }

    const total=rows.reduce((a,r)=>a+(r.points||0),0);
    animateNum(el("s-players"),rows.length);animateNum(el("s-points"),total);animateNum(el("s-co2"),Math.round(total*CO2_PER_POINT));

    const top=rows.slice(0,3),order=[top[1],top[0],top[2]];
    el("podium").innerHTML=order.map((r,i)=>{
      if(!r)return "<div></div>";
      const place=i===1?1:(i===0?2:3),big=place===1,sz=big?110:86;
      return `<div class="col ${big?'first':''}">${big?'<div class="crown">👑</div>':''}
        <div class="ava" style="width:${sz}px;height:${sz}px;font-size:${big?42:32}px;background:${grad(r.name)}">${initial(r.name)}</div>
        <div class="name">${esc(first(r.name))}</div>${tierPill(r.points||0)}
        <div class="pts">${fmt(r.points)} pts</div>
        <div class="stand" style="height:${HEIGHTS[place-1]}px;background:linear-gradient(180deg,${PODIUM_COLORS[place-1]},rgba(255,255,255,.05))"><span class="n">${place}</span></div>
      </div>`;
    }).join("");

    el("list").innerHTML=rows.map((r,i)=>{
      const rank=i+1,medal=rank<=3,grew=!firstLoad&&prevPoints[r.uid]!=null&&r.points>prevPoints[r.uid];
      const gap=i>0?rows[i-1].points-r.points:0;
      const sub=i===0?"👑 Leading the campus":`▲ ${fmt(gap)} pts to overtake ${esc(first(rows[i-1].name))}`;
      return `<div class="row ${grew?'flash':''}">
        <div class="r-rank">${medal?`<span class="m">${MEDALS[rank-1]}</span>`:rank}</div>
        <div class="r-move">${moveBadge(r.uid,rank)}</div>
        <div class="r-ava" style="background:${grad(r.name)}">${initial(r.name)}</div>
        <div class="r-name"><div class="r-top"><b>${esc(r.name||'Explorer')}</b>${tierPill(r.points||0)}</div><div class="r-sub">${sub}</div></div>
        <div class="r-pts">${fmt(r.points)}<small>pts</small></div>
      </div>`;
    }).join("");

    prevPoints={};prevRank={};rows.forEach((r,i)=>{prevPoints[r.uid]=r.points;prevRank[r.uid]=i+1;});
    prevLeader=rows[0]?rows[0].uid:null;firstLoad=false;lastUpdate=Date.now();el("updated").textContent="Updated just now";
  }

  setInterval(()=>{if(!lastUpdate)return;const s=Math.floor((Date.now()-lastUpdate)/1000);el("updated").textContent=s<3?"Updated just now":(s<60?`Updated ${s}s ago`:`Updated ${Math.floor(s/60)}m ago`);},1000);

  // fullscreen + QR (view on your phone)
  el("fs").onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else d.requestFullscreen&&d.requestFullscreen();};
  const here=encodeURIComponent(location.href.split('#')[0]);
  el("qr").innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&margin=0&data=${here}" alt="QR" onerror="this.parentNode.style.display='none'"><div class="t"><b>Scan to view</b><br>on your phone</div>`;

  const q=query(collection(db,"users"),orderBy("points","desc"),limit(20));
  onSnapshot(q,snap=>render(snap.docs.map(d=>({uid:d.id,...d.data()}))),err=>{
    const s=el("state");s.style.display="block";
    s.innerHTML="Couldn't load the leaderboard.<small>The station display needs read access to the <b>users</b> collection. In Firebase, enable <b>Anonymous Authentication</b> and allow read on <code>users</code> for signed-in clients. ("+esc(err.code||err.message||"error")+")</small>";
    console.error(err);
  });
</script>
</body>
</html>
