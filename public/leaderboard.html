<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#F4F6EF" />
<title>PSAUx — Sustainability Passport · Live</title>
<link rel="icon" href="/emblem.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ff:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --paper:#F1F5EA;--card:#FFFFFF;--line:#EAEFE0;--line2:#DCE6CE;
    --ink:#28331F;--ink2:#69795C;--ink3:#9DAB90;
    --green:#5C8A38;--green-d:#3E6624;--green-t:#EDF4E1;
    --gold:#E0A52B;--gold-d:#A6790F;--gold-t:#FBF3DC;--gold-b:#EAD9A6;
    --cream:#FAF4E2;--cream2:#F4E9C8;
    --r:22px;
  }
  [dir=rtl]{--ff:"IBM Plex Sans Arabic","Poppins",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;font-family:var(--ff)}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(80% 50% at 50% -10%,rgba(92,138,56,.08),transparent 70%)}
  #confetti{position:fixed;inset:0;z-index:60;pointer-events:none}
  /* phones / medium widths: clean centered single column (big-screen kiosk grid
     kicks in at >=1000px and overrides this) */
  .wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:18px 16px 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(40,51,31,.03),0 12px 30px rgba(40,51,31,.06)}
  svg{display:block}

  /* ── header ── */
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .logo{width:44px;height:44px;border-radius:13px;background:var(--green-t);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brand img{height:34px}
  .brand .bt{font-size:22px;font-weight:800;line-height:1;color:var(--green-d);letter-spacing:-.3px}
  .brand .bs{font-size:11px;letter-spacing:.2px;color:var(--green);font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
  .brand .bs2{font-size:9.5px;letter-spacing:.2px;color:var(--ink3);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
  [dir=rtl] .brand .bs,[dir=rtl] .brand .bs2{letter-spacing:0}
  .hright{display:flex;align-items:center;gap:9px;flex:0 0 auto}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:9px 14px;border-radius:30px;font-weight:600;font-size:13.5px;color:var(--ink)}
  .live{color:var(--green);font-weight:700}
  .clock{font-variant-numeric:tabular-nums}
  .dot{width:9px;height:9px;border-radius:50%;background:#4EA43C;box-shadow:0 0 0 0 rgba(78,164,60,.5);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(78,164,60,.45)}70%{box-shadow:0 0 0 11px rgba(78,164,60,0)}100%{box-shadow:0 0 0 0 rgba(78,164,60,0)}}
  .ctrl{cursor:pointer;transition:background .15s,transform .15s}
  .ctrl:hover{background:#EDF2E4}
  .ctrl:active{transform:scale(.96)}

  /* ── motivational message (in header) ── */
  .motiv{display:inline-flex;align-items:center;gap:9px;font-size:17px;font-weight:700;color:var(--ink);background:linear-gradient(110deg,var(--cream),var(--cream2));border:1px solid var(--gold-b);padding:10px 20px;border-radius:30px;white-space:nowrap;box-shadow:0 2px 8px rgba(224,165,43,.14)}
  .motiv .tro{font-size:20px}
  .motiv b{color:var(--green-d);font-weight:800}
  .motiv .one{color:var(--gold-d);font-weight:800}
  @media (max-width:820px){.motiv{display:none}}

  /* ── podium scene ── */
  .scene-card{overflow:hidden;padding:0;margin-bottom:16px;background:linear-gradient(180deg,#CFE6EC,#EFE7D0)}
  #scene{line-height:0}
  #scene svg{width:100%;height:auto}
  .tree{cursor:pointer;transition:filter .2s}
  .tree:hover{filter:brightness(1.05)}
  .cloud{animation:drift linear infinite}
  @keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(1360px)}}
  .swy{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--sw,4s) ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-1.3deg)}to{transform:rotate(1.3deg)}}
  .glow{animation:glow 3s ease-in-out infinite alternate}
  @keyframes glow{from{opacity:.35}to{opacity:.7}}

  /* ── stage + rail + partners (stacked on mobile) ── */
  .stage{display:flex;flex-direction:column;gap:16px;margin-top:16px}
  .rail{display:flex;flex-direction:column;gap:16px}
  .podium{background:linear-gradient(180deg,#CFE6EC,#EFE7D0);border-radius:16px;overflow:hidden;margin-bottom:12px}
  .row.lead{background:linear-gradient(100deg,var(--gold-t),#FFFDF7);border-color:var(--gold-b)}
  .partners{display:flex;align-items:center;gap:14px;padding:12px 18px;margin-top:16px;overflow:hidden}
  .pt-label{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;color:var(--green-d);white-space:nowrap;flex:0 0 auto}
  [dir=rtl] .pt-label{letter-spacing:0}
  .pt-list{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
  .pt-pill{display:inline-flex;align-items:center;gap:6px;background:var(--green-t);color:var(--green-d);font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:20px;white-space:nowrap}
  .pt-pill .dotc{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
  .kpi-tile{display:flex;align-items:center;gap:12px;padding:14px 16px}
  .kpi-tx{flex:1;min-width:0}
  .kpi-tx .l{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);font-weight:700}
  [dir=rtl] .kpi-tx .l{letter-spacing:0}
  .kpi-tx .v{font-size:22px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:2px}
  .kpi-tx .v small{font-size:12px;color:var(--ink3);font-weight:600;margin-inline-start:2px}

  /* ── leaderboard ── */
  .lb{padding:18px 18px 12px}
  .lb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 4px}
  .lb-head .t{display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:1.6px;font-weight:700;color:var(--green-d);text-transform:uppercase}
  [dir=rtl] .lb-head .t{letter-spacing:0}
  .lb-head .u{font-size:12px;color:var(--ink3);font-weight:500;display:flex;align-items:center;gap:6px}
  #rows{margin-top:6px;max-height:none;overflow:auto}
  .row{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:16px;cursor:pointer;transition:background .15s,transform .15s;border:1px solid transparent}
  .row:hover{background:#F4F8EE;transform:translateY(-1px)}
  .row+.row{margin-top:4px}
  .row.spot{border-color:var(--gold-b);background:#FCF7E6}
  .row.flash{animation:flash 2.2s ease-out}
  @keyframes flash{0%{background:var(--gold-t)}100%{background:transparent}}
  .r-medal{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex:0 0 auto;box-shadow:inset 0 -4px 7px rgba(0,0,0,.15),0 2px 5px rgba(40,51,31,.16)}
  .m1{background:linear-gradient(180deg,#F2CE55,#D69E1E)}
  .m2{background:linear-gradient(180deg,#C9D0D7,#9AA6B0)}
  .m3{background:linear-gradient(180deg,#DBA35C,#B87A34)}
  .mN{background:linear-gradient(180deg,#B7C6A6,#93A683);font-size:13px}
  .r-ava{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:inset 0 -6px 11px rgba(10,30,20,.18),0 3px 7px rgba(40,51,31,.14);overflow:hidden}
  .r-ava svg.pico{width:60%;height:60%}
  .r-main{flex:1;min-width:0}
  .r-name{font-size:17.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15}
  .r-role{font-size:12.5px;color:var(--ink2);font-weight:500;display:flex;align-items:center;gap:5px;margin-top:2px}
  .r-role svg{flex:0 0 auto}
  .pbar{height:8px;border-radius:5px;background:#ECF1E4;margin-top:9px;overflow:hidden;max-width:100%}
  .pbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#7DB24A,#5C8A38);transition:width .8s cubic-bezier(.2,.9,.3,1)}
  .r-col{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
  [dir=rtl] .r-col{align-items:flex-start}
  .r-pts{font-weight:800;font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .r-pts small{font-size:12px;color:var(--ink3);font-weight:600;margin-inline-start:3px}
  .badge{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  .b1{background:var(--gold-t);color:var(--gold-d)}
  .b2{background:#EEF2F4;color:#5B6B72}
  .b3{background:#FCEEE1;color:#C1743A}
  .bN{background:var(--green-t);color:var(--green-d)}
  @media (max-width:520px){.r-role{display:none}.r-pts{font-size:19px}}

  /* ── panels ── */
  .panel{padding:16px 18px}
  .panel-h{display:flex;align-items:center;gap:9px;font-size:14px;letter-spacing:1.4px;font-weight:700;color:var(--green-d);text-transform:uppercase;margin-bottom:12px;padding:0 2px}
  [dir=rtl] .panel-h{letter-spacing:0}
  .panel-h svg{flex:0 0 auto}

  /* actions */
  .act{display:flex;align-items:center;gap:13px;padding:11px 10px;border-radius:14px;cursor:default;transition:background .15s}
  .act:hover{background:#F4F8EE}
  .act+.act{margin-top:2px}
  .act-ic{width:42px;height:42px;border-radius:12px;background:var(--green-t);color:var(--green);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .act-tx{flex:1;min-width:0}
  .act-tx b{font-size:15px;font-weight:700;display:block}
  .act-tx span{font-size:12.5px;color:var(--ink2);font-weight:500}
  .act-pts{font-weight:800;font-size:14px;color:var(--green);white-space:nowrap;display:flex;align-items:center;gap:8px}
  .act-pts svg{color:var(--ink3)}
  .act-all{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;padding:10px;font-size:14px;font-weight:700;color:var(--green-d);cursor:pointer;border-radius:12px}
  .act-all:hover{background:var(--green-t)}

  /* reward */
  .rw-img{border-radius:16px;overflow:hidden;position:relative;height:186px;background:linear-gradient(160deg,#3E6624,#5C8A38)}
  .rw-img svg{width:100%;height:100%}
  .rw-badge{position:absolute;top:12px;inset-inline-end:12px;background:var(--green-d);color:#fff;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:20px}
  .rw-title{font-size:18px;font-weight:700;margin-top:13px}
  .rw-sub{font-size:13.5px;color:var(--ink2);font-weight:500;margin-top:3px}
  .rw-btn{margin-top:13px;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;background:var(--green-t);color:var(--green-d);font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
  .rw-btn:hover{background:#E2EED2}
  /* sponsor ad card (SDG-tagged offer) */
  .adcard{position:relative;border-radius:16px;padding:15px 16px;color:#fff;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:150px;background-image:linear-gradient(140deg,rgba(255,255,255,.16),rgba(0,0,0,.14));transition:opacity .35s}
  .ad-chip{align-self:flex-start;background:rgba(255,255,255,.24);color:#fff;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ad-body{display:flex;align-items:center;gap:14px;flex:1}
  .ad-txt{flex:1;min-width:0}
  .ad-offer{font-size:23px;font-weight:800;line-height:1.12}
  .ad-sub{font-size:13px;font-weight:500;opacity:.94;margin-top:5px}
  .ad-brand{font-size:12.5px;font-weight:800;letter-spacing:1.6px;margin-top:12px}
  [dir=rtl] .ad-brand{letter-spacing:0}
  .ad-logo{width:96px;height:96px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;text-align:center;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.16)}
  .ad-logo img{max-width:78%;max-height:78%;object-fit:contain}
  .ad-dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
  .ad-dots i{width:7px;height:7px;border-radius:50%;background:var(--line2);transition:background .2s,width .2s;cursor:pointer}
  .ad-dots i.on{background:var(--green);width:18px;border-radius:4px}
  .act-go{color:var(--ink3);display:flex;align-items:center}

  /* stats */
  .stat{display:flex;align-items:center;gap:14px;padding:14px 8px}
  .stat+.stat{border-top:1px solid var(--line)}
  .stat-ic{width:46px;height:46px;border-radius:13px;background:var(--green-t);color:var(--green);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .stat-tx{flex:1;min-width:0}
  .stat-tx .l{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);font-weight:700}
  [dir=rtl] .stat-tx .l{letter-spacing:0}
  .stat-tx .v{font-size:23px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
  .stat-tx .v small{font-size:13px;color:var(--ink3);font-weight:600;margin-inline-start:3px}
  .spark{width:76px;height:34px;flex:0 0 auto}

  /* state */
  .state{text-align:center;padding:70px 20px;color:var(--ink2);font-size:19px;font-weight:600}
  .state small{display:block;margin-top:12px;font-weight:400;font-size:14px;color:var(--ink3);max-width:560px;margin:12px auto 0;line-height:1.5}

  /* toasts */
  #toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
  .toast{background:#274016;color:#F1E4B6;font-weight:600;font-size:15.5px;padding:12px 22px;border-radius:30px;box-shadow:0 12px 30px rgba(40,51,31,.28);animation:tpop .35s cubic-bezier(.2,1.3,.4,1),tout .4s ease 3.4s forwards}
  @keyframes tpop{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-14px) scale(.96)}}

  /* player sheet */
  #ov{position:fixed;inset:0;z-index:50;background:rgba(24,32,22,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  #ov.open{display:flex}
  .sheet{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:22px 24px 28px;box-shadow:0 -18px 50px rgba(24,32,22,.25);animation:sheetup .32s cubic-bezier(.2,1.05,.35,1)}
  @keyframes sheetup{from{transform:translateY(60px);opacity:0}}
  @media (min-width:960px){#ov{align-items:center}.sheet{border-radius:24px}}
  .sh-top{display:flex;align-items:center;gap:14px}
  .sh-ava{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
  .sh-ava svg.pico{width:60%;height:60%}
  .sh-id{flex:1;min-width:0}
  .sh-id b{font-size:21px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sh-x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#EEF3E7;color:var(--ink2);font-size:14px;cursor:pointer;flex:0 0 auto}
  .sh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .sh-cell{background:#F4F8EE;border:1px solid var(--line);border-radius:15px;padding:12px;text-align:center}
  .sh-cell .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .sh-cell .l{font-size:10.5px;color:var(--ink2);font-weight:600;margin-top:3px}

  @media (max-width:600px){
    .wrap{padding:16px 14px}
    .hero{padding:18px;gap:16px}.hero .trophy{width:60px;height:60px;font-size:30px}
    .hero-txt h1{font-size:25px}.hero-txt p{font-size:13.5px}
    .brand .bt{font-size:18px}.clock{display:none}
  }
  /* compact phone sizing */
  @media (max-width:560px){
    .lb{padding:12px}
    .lb-head .t{font-size:14px}
    .row{padding:10px;gap:10px}
    .r-medal{width:30px;height:30px;font-size:13px}
    .r-ava{width:40px;height:40px}
    .r-name{font-size:16px}
    .r-pts{font-size:18px}
    .badge{font-size:10.5px;padding:4px 9px}
    .panel{padding:14px}
    .act{padding:8px 6px;gap:11px}
    .act-ic{width:36px;height:36px}
    .act-tx b{font-size:14.5px}.act-tx span{font-size:12px}
    .adcard .ad-offer{font-size:20px}.adcard .ad-logo{width:78px;height:78px}
    .partners{flex-wrap:wrap}
  }

  /* ══ one-screen KIOSK — leaderboard is the HERO, no page scroll ══ */
  @media (min-width:1000px){
    html,body{height:100%;overflow:hidden}
    .wrap{max-width:1720px;height:100vh;display:flex;flex-direction:column;padding:12px 22px 14px;overflow:hidden}
    header{margin-bottom:10px;flex:0 0 auto}
    #main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}

    .stage{flex:1;min-height:0;display:grid;grid-template-columns:1.85fr 1fr;gap:14px;margin:0}

    /* ── HERO leaderboard ── */
    .hero-lb{display:flex;flex-direction:column;min-height:0;padding:16px 22px 12px}
    .hero-lb .lb-head{margin-bottom:8px}
    .hero-lb .t{font-size:17px}
    .podium{margin:0 0 10px;flex:0 0 auto}
    .podium #scene{height:22vh;line-height:0}
    .podium #scene svg{width:100%;height:100%}
    #rows{flex:1;min-height:0;overflow:auto}
    .hero-lb .row{padding:13px 16px;gap:16px}.hero-lb .row+.row{margin-top:5px}
    .hero-lb .r-medal{width:42px;height:42px;font-size:17px}
    .hero-lb .r-ava{width:54px;height:54px}
    .hero-lb .r-name{font-size:21px}
    .hero-lb .r-role{font-size:13px}
    .hero-lb .r-pts{font-size:25px}
    .hero-lb .pbar{height:10px;margin-top:9px}
    .hero-lb .badge{font-size:12px;padding:5px 13px}

    /* ── support rail (smaller) ── */
    .rail{display:flex;flex-direction:column;gap:12px;min-height:0}
    .rail>*{min-height:0}
    .actions-card,.reward-card,.stats-card{padding:12px 15px;overflow:hidden}
    .rail .panel-h{margin-bottom:8px}
    .rail .act{padding:5px 8px}
    .rail .act-tx b{font-size:14px}.rail .act-tx span{font-size:11.5px}
    .rail .act-ic{width:36px;height:36px;border-radius:11px}
    .act-all{margin-top:4px;padding:7px}
    .reward-card{flex:1}
    .reward-card .adcard{flex:1;min-height:0;gap:8px}
    .reward-card .ad-logo{width:72px;height:72px}
    .reward-card .ad-offer{font-size:19px}
    .reward-card .ad-dots{margin-top:6px}
    .stats-card .kpi{grid-template-columns:repeat(2,1fr);gap:8px;margin:0}
    .stats-card .kpi-tile{padding:8px 12px}
    .stats-card .spark{display:none}
    .stats-card .kpi-tx .v{font-size:19px}

    /* ── partners strip ── */
    .partners{flex:0 0 auto;margin:0;justify-content:flex-start}
    .pt-list{flex-wrap:nowrap;overflow:hidden}
  }
  /* larger type on very big lobby displays */
  @media (min-width:1560px){
    .brand .bt{font-size:25px}.motiv{font-size:19px}
    .hero-lb .r-name{font-size:23px}.hero-lb .r-pts{font-size:28px}
    .hero-lb .r-ava{width:58px;height:58px}

  }

  function animateNum(node,to,suffix){if(!node)return;const from=parseFloat((node.dataset.v||"0"))||0;node.dataset.v=to;const t0=performance.now();const dec=to%1!==0;(function s(t){const k=Math.min(1,(t-t0)/700);const val=from+(to-from)*(1-Math.pow(1-k,3));node.textContent=(dec?val.toFixed(2):fmt(Math.round(val)))+(suffix||"");if(k<1)requestAnimationFrame(s);})(t0);}
  function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;el("toasts").appendChild(d);setTimeout(()=>d.remove(),4000);}

  // sparkline — deterministic gentle upward trend, seeded by label
  function spark(seed){
    const h=hash(seed),n=12,pts=[];let v=.35;
    for(let i=0;i<n;i++){v+=((h>>(i%20))&7)/40-.03;v=Math.max(.08,Math.min(.95,v+i*.03));pts.push(v);}
    const W=76,H=34,step=W/(n-1);
    const path=pts.map((p,i)=>`${(i*step).toFixed(1)},${(H-4-p*(H-8)).toFixed(1)}`).join(" ");
    return `<svg class="spark" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="sg${h%97}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DB24A" stop-opacity=".28"/><stop offset="1" stop-color="#7DB24A" stop-opacity="0"/></linearGradient></defs>
      <polyline points="0,${H} ${path} ${W},${H}" fill="url(#sg${h%97})" stroke="none"/>
      <polyline points="${path}" fill="none" stroke="#5C8A38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  // ── confetti ──
  const cvs=el("confetti"),ctx=cvs.getContext("2d");let parts=[],raf=null;
  function rz(){cvs.width=innerWidth;cvs.height=innerHeight;}rz();addEventListener("resize",rz);
  function burst(n=100){const cols=["#5C8A38","#E0A52B","#F2CE55","#3E6624","#7DB24A","#D69E1E"];for(let i=0;i<n;i++)parts.push({x:innerWidth*(.3+Math.random()*.4),y:-20,vx:(Math.random()-.5)*9,vy:Math.random()*4+2,g:.16,s:6+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]});if(!raf)loop();}
  function loop(){ctx.clearRect(0,0,cvs.width,cvs.height);parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);ctx.restore();});parts=parts.filter(p=>p.y<cvs.height+30);if(parts.length)raf=requestAnimationFrame(loop);else{raf=null;ctx.clearRect(0,0,cvs.width,cvs.height);}}

  // ══ podium scene — Saudi date-palm oasis ══
  // Each podium tree is a نخلة (date palm), the national tree; the champion's
  // palm carries hanging gold date bunches and a warm glow.
  const FROND=["#2E7D5B","#1C6B4C","#3E8E63","#247253","#15654A"];
  function palmTree(cx,baseY,s,seed,crowned){
    const h=hash(seed);
    const H=72*s;                                   // trunk height
    const bend=((h%2)?1:-1)*H*.05;
    const topX=cx+bend, topY=baseY-H;
    const tw=Math.max(7,H*.11);                     // trunk width at base
    // tapered trunk with date-palm diamond segments
    let trunk=`<path d="M${(cx-tw/2).toFixed(1)} ${baseY} Q${(cx+bend*1.4).toFixed(1)} ${(baseY-H*.55).toFixed(1)} ${(topX-tw*.28).toFixed(1)} ${topY.toFixed(1)} L${(topX+tw*.28).toFixed(1)} ${topY.toFixed(1)} Q${(cx+bend*1.4+tw).toFixed(1)} ${(baseY-H*.55).toFixed(1)} ${(cx+tw/2).toFixed(1)} ${baseY} Z" fill="#9A7549"/>`;
    [.18,.32,.46,.60,.74,.86].forEach(f=>{const yy=baseY-H*f,xx=cx+bend*f*1.2,ww=tw*(1.12-f*.5);
      trunk+=`<path d="M${(xx-ww*.5).toFixed(1)} ${yy.toFixed(1)} q${(ww*.5).toFixed(1)} 4.5 ${ww.toFixed(1)} 0" stroke="#79582F" stroke-width="1.3" fill="none" opacity=".55"/>`;});
    const FL=46*s;
    const cA=FROND[h%FROND.length],cB=FROND[(h+2)%FROND.length],cC=FROND[(h+4)%FROND.length];
    const blade=(dx,dy,sc,col)=>{
      const ax=topX,ay=topY;
      const tx=ax+dx*FL*sc,ty=ay+(dy+Math.abs(dx)*.2)*FL*sc;
      const ux=ax+dx*FL*.3*sc,uy=ay-FL*.5*sc;
      const lx=ax+dx*FL*.6*sc,ly=ay-FL*.05*sc;
      return `<path d="M${ax.toFixed(1)} ${ay.toFixed(1)} Q${ux.toFixed(1)} ${uy.toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)} Q${lx.toFixed(1)} ${ly.toFixed(1)} ${ax.toFixed(1)} ${ay.toFixed(1)} Z" fill="${col}"/>`;
    };
    let crown="";
    [[-.95,0],[-.4,-.32],[.4,-.32],[.95,0]].forEach(d=>{crown+=blade(d[0],d[1]+.05,1.05,cB);});
    [[-1,.08],[-.75,-.15],[-.45,-.32],[-.15,-.44],[.15,-.44],[.45,-.32],[.75,-.15],[1,.08]].forEach((d,i)=>{crown+=blade(d[0],d[1],1,i%2?cA:cC);});
    [[-.55,-.28],[.12,-.46],[.55,-.28]].forEach(d=>{crown+=blade(d[0],d[1],.55,"#4EA47A");});
    crown+=`<ellipse cx="${topX.toFixed(1)}" cy="${topY.toFixed(1)}" rx="${(tw*.9).toFixed(1)}" ry="${(tw*.5).toFixed(1)}" fill="#155C41"/>`;
    let dates="";
    if(crowned){ // champion palm: hanging gold date bunches
      [[-1,.16],[1,.19]].forEach(c=>{const bx=topX+c[0]*FL*.22,by=topY+FL*c[1];
        dates+=`<path d="M${topX.toFixed(1)} ${topY.toFixed(1)} Q${bx.toFixed(1)} ${(by-8).toFixed(1)} ${bx.toFixed(1)} ${(by-2).toFixed(1)}" stroke="#A9832F" stroke-width="1.6" fill="none"/>`;
        [[0,0],[4,3],[-4,3],[2,6.5],[-2,6.5],[0,10]].forEach(o=>{dates+=`<circle cx="${(bx+o[0]).toFixed(1)}" cy="${(by+o[1]).toFixed(1)}" r="3" fill="#E9C349" stroke="#A9832F" stroke-width=".7"/>`;});});
    }
    const glow=crowned?`<circle class="glow" cx="${topX.toFixed(1)}" cy="${(topY-FL*.2).toFixed(1)}" r="${(FL*1.2).toFixed(1)}" fill="#F7DE7E" opacity=".5"/>`:"";
    return `${glow}<g class="swy">${trunk}${crown}${dates}</g>`;
  }
  function podium(cx,topY,w,botY,tone){
    const rx=w/2;
    return `<g>
      <ellipse cx="${cx}" cy="${botY}" rx="${rx}" ry="${(rx*.2).toFixed(1)}" fill="rgba(30,40,25,.12)"/>
      <rect x="${cx-rx}" y="${topY}" width="${w}" height="${botY-topY}" fill="${tone[1]}"/>
      <path d="M${cx-rx} ${topY} v${botY-topY} a${rx} ${(rx*.2).toFixed(1)} 0 0 0 ${w} 0 v${-(botY-topY)}" fill="none"/>
      <ellipse cx="${cx}" cy="${botY}" rx="${rx}" ry="${(rx*.2).toFixed(1)}" fill="${tone[2]}"/>
      <rect x="${cx-rx}" y="${topY}" width="${w}" height="${botY-topY}" fill="url(#pshade)"/>
      <ellipse cx="${cx}" cy="${topY}" rx="${rx}" ry="${(rx*.2).toFixed(1)}" fill="${tone[0]}"/>
    </g>`;
  }
  function medal(cx,cy,rank,crowned){
    const col=rank===1?["#F2CE55","#D69E1E"]:rank===2?["#CDD4DA","#9AA6B0"]:["#DBA35C","#B87A34"];
    const crown=crowned?`<path d="M${cx-16} ${cy-24} l6 -15 l10 9 l0 -14 l0 14 l10 -9 l6 15 Z" fill="#F2CE55" stroke="#C79415" stroke-width="1.4" stroke-linejoin="round"/>`:"";
    return `${crown}<circle cx="${cx}" cy="${cy}" r="17" fill="${col[0]}" stroke="${col[1]}" stroke-width="2.2"/>
      <text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="18" font-weight="800" fill="#fff" font-family="Poppins,sans-serif">${rank}</text>`;
  }
  function ptsPill(cx,cy,txt){
    const label=lang==="en"?`${txt} pts`:txt;
    const w=Math.max(58,label.length*11+26);
    return `<g><rect x="${cx-w/2}" y="${cy-15}" width="${w}" height="30" rx="15" fill="#FFFFFF" opacity=".92"/>
      <text x="${cx}" y="${cy+5.5}" text-anchor="middle" font-size="15" font-weight="800" fill="#3E6624" font-family="Poppins,sans-serif">${label}</text></g>`;
  }

  // desert palm silhouette for the horizon grove
  function farPalm(x,y,s,col){
    let p=`<path d="M${x} ${y} q${2.5*s} -${30*s} 0 -${46*s}" stroke="${col}" stroke-width="${3.4*s}" fill="none" stroke-linecap="round"/>`;
    [[-1,-.05],[-.5,-.4],[.5,-.4],[1,-.05],[0,-.6]].forEach(d=>{p+=`<path d="M${x} ${(y-46*s).toFixed(1)} q${d[0]*15*s} ${d[1]*10*s} ${d[0]*26*s} ${(d[1]*16*s+11*s).toFixed(1)}" stroke="${col}" stroke-width="${2.6*s}" fill="none" stroke-linecap="round"/>`;});
    return p;
  }
  // Najdi mud-brick building with triangular merlons (matches the PSAU emblem)
  function merlons(x,w,y,tw,col){let s="";const n=Math.floor(w/tw);for(let i=0;i<n;i++){const mx=x+i*tw+(w-n*tw)/2;s+=`<path d="M${mx.toFixed(1)} ${y} l${(tw/2).toFixed(1)} -${(tw*.85).toFixed(1)} l${(tw/2).toFixed(1)} ${(tw*.85).toFixed(1)} Z" fill="${col}"/>`;}return s;}

  function sceneSvg(rows){
    const W=1200,Hh=520,ground=470;
    const top=rows.slice(0,3);
    // podium slots: [left #2, center #1, right #3] — sandstone tones
    const slots=[
      {cx:300,w:180,topY:398,botY:ground,tree:.9,tone:["#E7DCC4","#CDBE9C","#BBAB86"]},
      {cx:600,w:214,topY:360,botY:ground,tree:1.14,tone:["#F0E4BF","#E0CE9A","#CFBB84"]},
      {cx:900,w:170,topY:412,botY:ground,tree:.82,tone:["#EADCC6","#D3BD9C","#C2A886"]}
    ];
    const order=[1,0,2]; // rows index → slot index (row0=#1→center, row1=#2→left, row2=#3→right)
    let podiums="",trees="",medals="",labels="";
    top.forEach((r,ri)=>{
      const si=order[ri],s=slots[si];
      podiums+=podium(s.cx,s.topY,s.w,s.botY,s.tone);
      const crowned=ri===0;
      trees+=`<g class="tree" data-uid="${esc(r.uid)}" style="--sw:${(3.4+hash(r.uid)%3)}s">${palmTree(s.cx,s.topY+3,s.tree,r.uid+(r.name||""),crowned)}</g>`;
      const H=72*s.tree,topY=s.topY+3-H,frondTop=topY-46*s.tree*.5;
      medals+=medal(s.cx,frondTop-18,ri+1,crowned);
      labels+=ptsPill(s.cx,(s.topY+s.botY)/2,fmt(r.points));
      // name under podium
      labels+=`<text x="${s.cx}" y="${s.botY+26}" text-anchor="middle" font-size="15" font-weight="700" fill="#3E6624" font-family="Poppins,sans-serif">${esc((r.name||"—").slice(0,14))}</text>`;
    });

    // ── desert-oasis backdrop ──
    const clouds=`<g class="cloud" style="animation-duration:100s"><ellipse cx="0" cy="72" rx="46" ry="14" fill="#fff" opacity=".65"/><ellipse cx="34" cy="64" rx="28" ry="11" fill="#fff" opacity=".65"/></g>
      <g class="cloud" style="animation-duration:140s;animation-delay:-70s"><ellipse cx="0" cy="128" rx="52" ry="14" fill="#fff" opacity=".5"/><ellipse cx="36" cy="120" rx="28" ry="10" fill="#fff" opacity=".5"/></g>`;
    const sun=`<circle cx="990" cy="115" r="50" fill="#F6CE6A" opacity=".3"/><circle cx="990" cy="115" r="32" fill="#F7C95C"/>`;
    // Najdi citadel: mud-brick tower + block with triangular merlons + arched gate
    const B="#C9A876",Bd="#B4915F",Bt="#D8BB90";
    const building=`<g opacity=".92">
      <rect x="1024" y="300" width="132" height="150" fill="${B}"/>
      <rect x="1024" y="300" width="132" height="150" fill="url(#bshade)"/>
      ${merlons(1024,132,300,15,Bt)}
      <rect x="1058" y="242" width="58" height="62" fill="${Bd}"/>
      ${merlons(1058,58,242,13,Bt)}
      <path d="M1074 450 v-30 a13 13 0 0 1 26 0 v30 Z" fill="#7A5C38"/>
      <g fill="#8A6B44"><rect x="1040" y="330" width="12" height="16" rx="2"/><rect x="1128" y="330" width="12" height="16" rx="2"/><rect x="1070" y="268" width="9" height="13" rx="2"/><rect x="1096" y="268" width="9" height="13" rx="2"/></g>
      <circle cx="1090" cy="238" r="3" fill="${Bt}"/></g>`;
    // horizon palm grove
    let grove="";for(let i=0;i<7;i++){const x=90+i*150,y=352+(i*17)%12,s=.55+(i%3)*.16;grove+=farPalm(x,y,s,"#A7B98C");}
    // oasis pond bottom-left
    const pond=`<g><ellipse cx="150" cy="452" rx="86" ry="15" fill="#BFE0EC"/><ellipse cx="150" cy="450" rx="72" ry="11" fill="#9CCBDD"/><path d="M110 448 h22 M170 454 h16" stroke="#fff" stroke-width="1.6" opacity=".55" stroke-linecap="round"/></g>`;
    // sand dune band + a few grass tufts on the oasis
    let tufts="";for(let i=0;i<10;i++){const tx=260+(i*211)%(W-320),ty=452+(i*37)%14;tufts+=`<path d="M${tx} ${ty} q-2 -6 -4 -8 M${tx} ${ty} q0 -7 0 -9 M${tx} ${ty} q2 -6 4 -8" stroke="#7FB088" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;}

    return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="xMidYMax meet" role="img">
      <defs>
        <linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE6EC"/><stop offset=".5" stop-color="#E8EFDE"/><stop offset="1" stop-color="#F3EAD2"/></linearGradient>
        <linearGradient id="pshade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".14"/><stop offset=".18" stop-color="#000" stop-opacity="0"/><stop offset=".82" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>
        <linearGradient id="bshade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".14"/></linearGradient>
      </defs>
      <rect width="${W}" height="${Hh}" fill="url(#skyg)"/>
      ${sun}${clouds}
      <path d="M0 322 Q320 292 700 314 T1200 308 L1200 ${Hh} L0 ${Hh} Z" fill="#E3D4AE"/>
      ${grove}
      ${building}
      <path d="M0 360 Q380 330 800 356 T1200 350 L1200 ${Hh} L0 ${Hh} Z" fill="#DEC9A0"/>
      <path d="M0 402 Q300 384 640 400 T1200 396 L1200 ${Hh} L0 ${Hh} Z" fill="#B6D3B0"/>
      <rect y="${ground-2}" width="${W}" height="${Hh-ground+2}" fill="#A9CFAE"/>
      ${pond}
      ${tufts}
      ${podiums}
      ${trees}
      ${medals}
      ${labels}
    </svg>`;
  }

  // ── render ──
  function badgeFor(rank){
    if(rank===1)return `<span class="badge b1">🏆 ${T().b1}</span>`;
    if(rank===2)return `<span class="badge b2">📈 ${T().b2}</span>`;
    if(rank===3)return `<span class="badge b3">⭐ ${T().b3}</span>`;
    return `<span class="badge bN">${T().bN}</span>`;
  }
  function rowHtml(r,rank){
    const grew=!firstLoad&&prevPoints[r.uid]!=null&&r.points>prevPoints[r.uid];
    const t=tier(r.points||0),lead=lastRows[0]?lastRows[0].points||0:0;
    const pct=lead>0?Math.max(3,Math.round((r.points||0)/lead*100)):(rank===1?100:3);
    const mcls=rank<=3?("m"+rank):"mN";
    return `<div class="row ${rank===1?'lead':''} ${grew?'flash':''}" data-uid="${esc(r.uid)}">
      <div class="r-medal ${mcls}">${rank}</div>
      <div class="r-ava" style="background:${color(r.name)}">${avatar(r.name)}</div>
      <div class="r-main">
        <div class="r-name">${esc(r.name||"—")}</div>
        <div class="r-role">${ICONS.leafSm} ${tname(t)}</div>
        <div class="pbar"><i style="width:${pct}%"></i></div>
      </div>
      <div class="r-col">
        <div class="r-pts">${fmt(r.points)}<small>${T().pts}</small></div>
        ${badgeFor(rank)}
      </div>
    </div>`;
  }

  function renderHero(rows){
    let h;
    if(rows.length<=1)h=T().motivSolo;
    else{const gap=(rows[0].points||0)-(rows[1].points||0);
      h=gap===0?T().motivTie:T().motiv(fmt(gap));}
    el("motiv").innerHTML=h;
  }

  function render(rows){
    if(!rows.length){el("state").style.display="block";el("main").style.display="none";el("state").textContent=T().noPlayers;return;}
    const sig=JSON.stringify(rows.map(r=>[r.uid,r.name,r.points,r.updatedAt]))+lang;
    if(sig===lastSig&&booted){lastUpdate=Date.now();return;}
    el("state").style.display="none";el("main").style.display="";

    gained=new Set();
    if(!firstLoad){
      rows.forEach(r=>{const b=prevPoints[r.uid];if(b!=null&&r.points>b){toast(T().earnedT(first(r.name),fmt(r.points-b)));gained.add(r.uid);}});
      if(gained.size)burst(90);
      if(rows[0]&&prevLeader&&rows[0].uid!==prevLeader){toast(T().leadT(first(rows[0].name)));burst(150);}
    }

    lastRows=rows;
    renderHero(rows);
    el("scene").innerHTML=sceneSvg(rows);
    el("rows").innerHTML=rows.map((r,i)=>rowHtml(r,i+1)).join("");

    // stats
    const total=rows.reduce((a,r)=>a+(r.points||0),0),kg=Math.round(total*CO2_PER_POINT),bt=Math.round(total*BOTTLE_SHARE/POINTS_PER_BOTTLE),tons=kg/1000;
    el("stats").innerHTML=`
      <div class="kpi-tile card"><div class="stat-ic">${ICONS.users}</div><div class="kpi-tx"><div class="l">${T().stTotal}</div><div class="v" id="s1">0</div></div>${spark("total"+total)}</div>
      <div class="kpi-tile card"><div class="stat-ic">${ICONS.tree}</div><div class="kpi-tx"><div class="l">${T().stTrees}</div><div class="v" id="s2">0</div></div>${spark("trees"+rows.length)}</div>
      <div class="kpi-tile card"><div class="stat-ic">${ICONS.bottle}</div><div class="kpi-tx"><div class="l">${T().stBottles}</div><div class="v" id="s3">0</div></div>${spark("bottles"+bt)}</div>
      <div class="kpi-tile card"><div class="stat-ic">${ICONS.cloud}</div><div class="kpi-tx"><div class="l">${T().stCo2}</div><div class="v" id="s4">0</div></div>${spark("co2"+kg)}</div>`;
    animateNum(el("s1"),total);
    animateNum(el("s2"),rows.length);
    animateNum(el("s3"),bt);
    animateNum(el("s4"),tons," "+T().tons);

    if(sheetUid)fillSheet();

    prevPoints={};rows.forEach(r=>{prevPoints[r.uid]=r.points;});
    prevLeader=rows[0]?rows[0].uid:null;firstLoad=false;booted=true;lastSig=sig;lastUpdate=Date.now();
    el("lb-updated").textContent=T().updatedNow;
  }

  // ── static chrome (bilingual) ──
  function chrome(){

    el("h-title").textContent=T().title;el("h-kicker").textContent=T().kicker;el("h-tagline").textContent=T().tagline;el("h-live").textContent=T().live;

    el("act-list").innerHTML=T().acts.map(a=>`<div class="act"><div class="act-ic">${ICONS[a[0]]}</div><div class="act-tx"><b>${a[1]}</b><span>${a[2]}</span></div><div class="act-go">${ICONS.chev}</div></div>`).join("");
    el("pt-list").innerHTML=PARTNERS.map(p=>`<span class="pt-pill"><span class="dotc" style="background:${p.c}"></span>${esc(p.n)}</span>`).join("");
    renderAd();
    if(!booted)el("state").textContent=T().connecting;
  }

  // ── rotating sponsor ad / reward cards ──
  let adIdx=0;
  function renderAd(){
    if(!REWARDS.length)return;
    const r=REWARDS[adIdx%REWARDS.length],sg=SDG[r.sdg]||{c:"#5C8A38",en:"Sustainability",ar:"الاستدامة"},L=lang==="ar"?r.ar:r.en;
    const card=el("adcard");if(!card)return;
    card.style.backgroundColor=sg.c;
    const logo=r.logoImg?`<img src="${r.logoImg}" alt="${esc(r.brand)}"/>`:(r.logoHtml||esc(r.brand));
    card.innerHTML=`
      <div class="ad-chip">SDG ${r.sdg} · ${lang==="ar"?sg.ar:sg.en}</div>
      <div class="ad-body">
        <div class="ad-txt">
          <div class="ad-offer">${esc(L.offer)}</div>
          <div class="ad-sub">${esc(L.sub)}</div>
          <div class="ad-brand">${esc(r.brand)}</div>
        </div>
        <div class="ad-logo">${logo}</div>
      </div>`;
    const dots=el("ad-dots");
    if(dots)dots.innerHTML=REWARDS.length>1?REWARDS.map((_,i)=>`<i class="${i===adIdx%REWARDS.length?'on':''}" data-ad="${i}"></i>`).join(""):"";
  }
  el("ad-dots").addEventListener("click",e=>{const i=e.target.dataset&&e.target.dataset.ad;if(i!=null){adIdx=+i;renderAd();}});
  setInterval(()=>{if(REWARDS.length>1){const c=el("adcard");if(c)c.style.opacity=".0";setTimeout(()=>{adIdx=(adIdx+1)%REWARDS.length;renderAd();if(c)c.style.opacity="1";},350);}},6000);

  // ── player sheet ──
  function fillSheet(){
    const i=lastRows.findIndex(r=>r.uid===sheetUid);
    if(i<0){closeSheet();return;}
    const r=lastRows[i],rank=i+1,t=tier(r.points||0),st=pstats(r),act=ago(r.updatedAt);
    el("sheet").innerHTML=`
      <div class="sh-top">
        <div class="sh-ava" style="background:${color(r.name)}">${avatar(r.name)}</div>
        <div class="sh-id"><b>${esc(r.name||"—")}</b><div class="r-role" style="margin-top:4px">${ICONS.leafSm} ${tname(t)}</div></div>
        <button class="sh-x" id="sh-x">✕</button>
      </div>
      <div class="sh-grid">
        <div class="sh-cell"><div class="v">#${rank}</div><div class="l">${T().rank}</div></div>
        <div class="sh-cell"><div class="v" style="color:var(--green)">${fmt(r.points)}</div><div class="l">${T().points}</div></div>
        <div class="sh-cell"><div class="v" style="font-size:13px">${act||"—"}</div><div class="l">${T().lastActive}</div></div>
        <div class="sh-cell"><div class="v">${fmt(st.bottles)}</div><div class="l">${T().bottlesL}</div></div>
        <div class="sh-cell"><div class="v">${fmt(st.kg)}</div><div class="l">${T().co2L}</div></div>
        <div class="sh-cell"><div class="v" style="font-size:12.5px">${tname(t)}</div><div class="l">${T().tierL}</div></div>
      </div>`;
    el("sh-x").onclick=closeSheet;
  }
  function openSheet(uid){sheetUid=uid;fillSheet();el("ov").classList.add("open");}
  function closeSheet(){sheetUid=null;el("ov").classList.remove("open");}
  el("ov").onclick=e=>{if(e.target===el("ov"))closeSheet();};
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
  function findUid(node,container){let n=node;while(n&&n!==container){if(n.dataset&&n.dataset.uid)return n.dataset.uid;n=n.parentNode;}return null;}
  el("rows").addEventListener("click",e=>{const u=findUid(e.target,el("rows"));if(u)openSheet(u);});
  el("scene").addEventListener("click",e=>{const u=findUid(e.target,el("scene"));if(u)openSheet(u);else burst(24);});

  // hover sync: row <-> tree
  el("rows").addEventListener("mouseover",e=>{const u=findUid(e.target,el("rows"));if(!u)return;const t=el("scene").querySelector(`[data-uid="${u}"]`);if(t)t.style.filter="brightness(1.08)";});
  el("rows").addEventListener("mouseout",e=>{const u=findUid(e.target,el("rows"));if(!u)return;const t=el("scene").querySelector(`[data-uid="${u}"]`);if(t)t.style.filter="";});

  // ── language toggle ──
  el("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("psaux_lang",lang);}catch(e){}chrome();lastSig="";if(lastRows.length)render(lastRows);};

  // ── data: anonymous auth + Firestore REST (polled) ──
  async function authFn(){
    const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:'{"returnSecureToken":true}'});
    if(!r.ok) throw new Error("auth "+r.status);
    idToken=(await r.json()).idToken;
  }
  function parseDoc(d){const f=d.fields||{};const S=k=>(f[k]&&f[k].stringValue)||"";const N=k=>f[k]?parseInt(f[k].integerValue||Math.round(f[k].doubleValue||0)):0;const TS=k=>S(k)||(f[k]&&f[k].timestampValue)||"";return{uid:(d.name||"").split("/").pop(),name:S("name"),points:N("points"),level:S("level"),updatedAt:TS("updatedAt"),createdAt:TS("createdAt")};}
  async function fetchUsers(){
    if(!idToken) await authFn();
    const url=`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/users?pageSize=100`;
    let r=await fetch(url,{headers:{Authorization:"Bearer "+idToken}});
    if(r.status===401){await authFn();r=await fetch(url,{headers:{Authorization:"Bearer "+idToken}});}
    if(!r.ok) throw new Error("read "+r.status);
    const rows=((await r.json()).documents||[]).map(parseDoc);
    rows.sort((a,b)=>(b.points||0)-(a.points||0));
    return rows.slice(0,20);
  }
  async function tick(){
    try{ render(await fetchUsers()); fails=0; }
    catch(e){ fails++; console.error(e);
      if(firstLoad||fails>=3){ el("main").style.display="none"; const s=el("state"); s.style.display="block";
        s.innerHTML=T().cantReach+"<small>"+T().cantReachSub+" ("+esc(e.message||"error")+")</small>"; }
    }
  }

  // ── chrome: clock, updated-ago ──
  function clockTick(){el("clock").textContent=new Date().toLocaleTimeString(lang==="ar"?"ar-SA":[],{hour:"2-digit",minute:"2-digit"});}
  chrome();clockTick();tick();
  setInterval(tick,POLL_MS);setInterval(clockTick,15e3);
  setInterval(()=>{if(!lastUpdate)return;const s=Math.floor((Date.now()-lastUpdate)/1000);el("lb-updated").textContent=s<3?T().updatedNow:(s<60?T().updatedS(s):T().updatedM(Math.floor(s/60)));},1000);
</script>
</body>
</html>
