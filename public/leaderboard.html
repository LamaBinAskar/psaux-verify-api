<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#F4F7F4" />
<title>PSAUx Campus Forest — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Palette + type from the PSAUxLONDON app (AppColors: passport green,
     antique gold, ledger surfaces; fontFamily: PlusJakartaSans). */
  :root{--ff:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --paper:#F4F7F4;--card:#FFFFFF;--line:#E2E8F0;--line-2:#D0DCD4;
    --ink:#1A1C1E;--ink2:#5A6B5E;--ink3:#9AA59C;
    --green:#0F5A3E;--green-d:#0B3D2E;--green-t:#EEF3EE;
    --amber:#C5A35A;--amber-d:#705D00;--amber-t:#F5EFDD;--amber-b:#E3D2A4;--r:20px}
  [dir=rtl]{--ff:"IBM Plex Sans Arabic","Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;font-family:var(--ff)}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(90% 55% at 50% -8%,rgba(15,90,62,.06),transparent 70%)}
  #confetti{position:fixed;inset:0;z-index:60;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:20px 26px 22px;min-height:100vh;display:flex;flex-direction:column}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(26,28,30,.04),0 10px 28px rgba(26,28,30,.06)}
  svg{display:block}

  /* ── header ── */
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .brand img{height:50px}
  .brand .k{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--green);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [dir=rtl] .brand .k{letter-spacing:0}
  .brand h2{font-size:28px;font-weight:800;line-height:1.08;color:var(--green-d);letter-spacing:-.5px;white-space:nowrap}
  [dir=rtl] .brand h2{letter-spacing:0}
  .hright{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:9px 14px;border-radius:30px;font-weight:600;font-size:13.5px;color:var(--ink)}
  .clock{font-variant-numeric:tabular-nums}
  .dot{width:9px;height:9px;border-radius:50%;background:#1F9D55;box-shadow:0 0 0 0 rgba(31,157,85,.5);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,85,.45)}70%{box-shadow:0 0 0 12px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
  .ctrl{height:40px;border-radius:30px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;padding:0 14px;transition:background .15s,transform .15s}
  .ctrl:hover{background:#E8EDE8}
  .ctrl:active{transform:scale(.96)}
  .ctrl.icon{width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  .updated{position:absolute;top:78px;inset-inline-end:26px;font-size:12px;color:var(--ink3);font-weight:500;z-index:2}

  .main{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;flex:1;min-height:0}
  @media (max-width:940px){.main{grid-template-columns:1fr}}

  /* ── forest scene ── */
  .arena{display:flex;flex-direction:column;min-height:0;gap:12px}
  .forest{overflow:hidden;display:flex;flex-direction:column;min-height:0;padding:0}
  .forest .cap{padding:12px 16px 8px}
  #scene{line-height:0}
  #scene svg{width:100%;height:auto}
  .cap{display:flex;align-items:center;gap:10px}
  .cap .tt{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--ink3)}
  [dir=rtl] .cap .tt{letter-spacing:0}

  /* scene animation layers */
  .cloud{animation:drift linear infinite}
  @keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(1080px)}}
  .tw{animation:tw ease-in-out infinite}
  @keyframes tw{50%{opacity:.15}}
  .fw{animation:fw ease-in-out infinite}
  @keyframes fw{50%{opacity:.15;transform:translateY(-6px)}}
  .fly{animation:fly linear infinite}
  @keyframes fly{from{transform:translate(-60px,0)}to{transform:translate(1020px,-40px)}}
  .flut{animation:flut .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  @keyframes flut{from{transform:scaleX(1)}to{transform:scaleX(.45)}}
  .tree{cursor:pointer}
  .tree .body{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--sw,4s) ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
  .tree.grow .body{animation:grow .9s cubic-bezier(.2,1.25,.4,1) backwards,sway var(--sw,4s) ease-in-out 1s infinite alternate}
  @keyframes grow{from{transform:scaleY(0)}}
  .tree:hover .body,.tree.lit .body{filter:brightness(1.12) drop-shadow(0 0 6px rgba(197,163,90,.55))}
  .tree.cheer .body{animation:cheer .5s ease 4 alternate}
  @keyframes cheer{to{transform:scale(1.06) rotate(1deg)}}

  .stats{display:flex;gap:10px}
  .stat{flex:1;min-width:0;padding:11px 12px;display:flex;align-items:center;gap:10px;border-radius:16px}
  .stat .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--green-t);color:var(--green);flex:0 0 auto}
  .stat .v{font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:10px;color:var(--ink2);font-weight:600;margin-top:3px}

  /* ── ranking list ── */
  .list{padding:10px;overflow:hidden;min-height:0;display:flex;flex-direction:column}
  .list .cap{padding:4px 6px 10px}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:#EEF3EE;border:1px solid var(--line);border-radius:13px;padding:8px 12px;color:var(--ink3);transition:border-color .2s}
  .search:focus-within{border-color:var(--green)}
  .search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-size:14px;font-weight:500}
  .search input::placeholder{color:var(--ink3)}
  #rows{overflow:auto;flex:1;min-height:0}
  .row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:15px;cursor:pointer;transition:background .15s,transform .15s;border:1px solid transparent}
  .row:hover{background:#F1F5F1;transform:translateY(-1px)}
  .row:active{transform:scale(.99)}
  .row+.row{margin-top:3px}
  .row.flash{animation:flash 2.4s ease-out}
  .row.hit{border-color:var(--amber-b);background:#F9F4E4}
  @keyframes flash{0%{background:var(--amber-t)}100%{background:transparent}}
  .r-rank{width:30px;display:flex;justify-content:center;font-weight:700;font-size:17px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .disc{width:27px;height:27px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(26,28,30,.2)}
  .d1{background:linear-gradient(180deg,#E9C349,#AF8D11)}
  .d2{background:linear-gradient(180deg,#BFC6CE,#98A2AD)}
  .d3{background:linear-gradient(180deg,#CBA24C,#A9832F)}
  .r-move{width:26px;font-size:12px;font-weight:700;text-align:center;flex:0 0 auto}
  .up{color:#1F7A3D}.down{color:#C0402A}.same{color:#C9C2AE}.newp{color:var(--amber)}
  .r-ava{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;flex:0 0 auto}
  .r-main{flex:1;min-width:0}
  .r-top{display:flex;align-items:center;gap:8px;min-width:0}
  .r-top b{font-size:16.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{font-size:10.5px;font-weight:700;color:var(--green);background:var(--green-t);border-radius:20px;padding:3px 9px;white-space:nowrap;flex:0 0 auto}
  .r-sub{font-size:12px;color:var(--ink2);font-weight:500;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meter{height:5px;border-radius:4px;background:#E6ECE7;margin-top:6px;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#C5A35A,#E9C349);transition:width .8s cubic-bezier(.2,.9,.3,1)}
  .race{margin:0 4px 8px;background:var(--amber-t);border:1px solid var(--amber-b);color:var(--amber-d);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:700;display:none;align-items:center;gap:8px}
  .race .flag{font-size:14px}
  .r-pts{font-weight:700;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .r-pts small{font-size:11px;color:var(--ink3);font-weight:600;margin-inline-start:3px}
  .tier{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{padding:26px 16px;text-align:center;color:var(--ink2);font-weight:500;font-size:14px}

  /* ── player sheet ── */
  #ov{position:fixed;inset:0;z-index:50;background:rgba(24,32,26,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  #ov.open{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:22px 24px 28px;box-shadow:0 -18px 50px rgba(24,32,26,.25);animation:sheetup .32s cubic-bezier(.2,1.05,.35,1)}
  @keyframes sheetup{from{transform:translateY(60px);opacity:0}}
  @media (min-width:940px){#ov{align-items:center}.sheet{border-radius:24px;border-bottom:1px solid var(--line);animation:sheetpop .28s cubic-bezier(.2,1.1,.35,1)}@keyframes sheetpop{from{transform:scale(.95);opacity:0}}}
  .sh-top{display:flex;align-items:center;gap:15px}
  .sh-ava{width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;flex:0 0 auto}
  .sh-id{flex:1;min-width:0}
  .sh-id b{font-size:22px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sh-x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#EEF3EE;color:var(--ink2);font-size:14px;cursor:pointer;flex:0 0 auto}
  .sh-x:hover{background:#E8EDE8}
  .sh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
  .sh-cell{background:#F3F6F3;border:1px solid var(--line);border-radius:15px;padding:11px 12px;text-align:center}
  .sh-cell .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .sh-cell .l{font-size:10.5px;color:var(--ink2);font-weight:600;margin-top:3px}
  .sh-cap{font-size:11px;letter-spacing:1.6px;font-weight:700;color:var(--ink3);margin-bottom:9px}
  [dir=rtl] .sh-cap{letter-spacing:0}
  .lad{display:flex;gap:5px}
  .lad-seg{flex:1;text-align:center}
  .lad-seg .bar{height:7px;border-radius:4px;background:#E6ECE7;overflow:hidden}
  .lad-seg .bar i{display:block;height:100%;border-radius:4px}
  .dot2{display:inline-block;width:9px;height:9px;border-radius:50%;margin-top:7px;opacity:.3}
  .lad-seg.done .dot2,.lad-seg.cur .dot2{opacity:1}
  .lad-seg.cur .dot2{transform:scale(1.45)}
  .sh-insight{margin-top:16px;background:var(--green-t);border:1px solid var(--line-2);border-radius:15px;padding:13px 15px;font-size:13.5px;line-height:1.55;color:var(--green-d);font-weight:500}

  /* ── footer ── */
  footer{margin-top:14px;display:flex;align-items:center;gap:16px;font-size:13.5px}
  .ticker{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);opacity:0;transition:opacity .35s;text-align:center}
  .ticker.show{opacity:1}
  .ticker small{font-weight:500;color:var(--ink3)}
  .state{text-align:center;padding:70px 20px;color:var(--ink2);font-size:19px;font-weight:600}
  .state small{display:block;margin-top:12px;font-weight:400;font-size:14px;color:var(--ink3);max-width:560px;margin:12px auto 0;line-height:1.5}

  #toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
  .toast{background:#002114;color:#EBD498;font-weight:600;font-size:16.5px;padding:13px 22px;border-radius:30px;box-shadow:0 12px 34px rgba(24,32,26,.3);animation:tpop .35s cubic-bezier(.2,1.3,.4,1),tout .4s ease 3.4s forwards}
  @keyframes tpop{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-14px) scale(.96)}}

  @media (max-width:940px){
    .brand h2{font-size:21px}.brand .k{font-size:9.5px}.clock{display:none}.updated{display:none}
    .stats{flex-wrap:wrap}.stat{flex:1 1 44%}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="confetti"></canvas>
<div id="toasts"></div>
<div class="updated" id="updated"></div>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="/emblem.png" alt="PSAUx" onerror="this.style.display='none'"/>
      <div style="min-width:0">
        <div class="k" id="h-kicker"></div>
        <h2 id="h-title"></h2>
      </div>
    </div>
    <div class="hright">
      <div class="pill clock" id="clock"></div>
      <div class="pill"><span class="dot"></span> <span id="h-live"></span></div>
      <button class="ctrl" id="lang"></button>
      <button class="ctrl icon" id="fs" title="Fullscreen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    </div>
  </header>

  <div class="main" id="main" style="display:none">
    <div class="arena">
      <div class="forest card">
        <div class="cap"><span class="tt" id="f-cap"></span></div>
        <div id="scene"></div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="list card">
      <div class="cap">
        <span class="tt" id="l-cap"></span>
        <label class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" autocomplete="off"/>
        </label>
      </div>
      <div class="race" id="race"></div>
      <div id="rows"></div>
    </div>
  </div>
  <div id="state" class="state"></div>

  <footer>
    <div class="ticker show" id="ticker"></div>
  </footer>
</div>

<div id="ov"><div class="sheet" id="sheet"></div></div>

<script>

  let lang="en";try{lang=localStorage.getItem("psaux_lang")||"en";}catch(e){}
  const T=()=>I18N[lang];

  let prevPoints={},prevRank={},firstLoad=true,booted=false,lastSig="",lastUpdate=0,prevLeader=null,idToken=null,fails=0;
  let lastRows=[],query="",tickerData=[],tickIdx=0,sheetUid=null,gained=new Set();

  const el=id=>document.getElementById(id);
  const initial=n=>((n||"?").trim().charAt(0)||"?").toUpperCase();
  const first=n=>(n||"?").trim().split(" ")[0];
  const esc=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt=n=>(n||0).toLocaleString("en-US");
  function hash(s){let h=0;s=s||"?";for(let i=0;i<s.length;i++)h=(h*33+s.charCodeAt(i))>>>0;return h;}
  const color=name=>PAL[hash(name)%PAL.length];
  function tier(p){let t=TIERS[0];for(const x of TIERS)if(p>=x.min)t=x;return t;}
  function tierPill(p){const t=tier(p);return `<span class="tier" style="background:${t.c}1A;color:${t.c}">${tname(t)}</span>`;}
  function progress(p){const i=TIERS.findIndex(t=>p<t.min);if(i<0)return{pct:100};const lo=TIERS[i-1].min,hi=TIERS[i].min;return{pct:Math.max(4,Math.round((p-lo)/(hi-lo)*100))};}
  function ago(iso){if(!iso)return"";const s=(Date.now()-Date.parse(iso))/1e3;if(!(s>=0))return"";if(s<90)return T().agoNow;if(s<3600)return T().agoM(Math.floor(s/60));if(s<86400)return T().agoH(Math.floor(s/3600));return T().agoD(Math.floor(s/86400));}

  // Per-player insight engine — derived from the account's real fields:
  // points, createdAt (rate of earning), updatedAt (recency).
  function pstats(r){
    const p=r.points||0;
    const kg=Math.round(p*CO2_PER_POINT);
    const bottles=Math.round(p*BOTTLE_SHARE/POINTS_PER_BOTTLE);
    const days=r.createdAt&&Date.parse(r.createdAt)?Math.max(1,Math.round((Date.now()-Date.parse(r.createdAt))/864e5)):null;
    const vel=days?Math.round(p/days):null;
    const fresh=r.updatedAt&&(Date.now()-Date.parse(r.updatedAt))<1728e5;
    let s="steady";
    if(p<100)s="starter";else if(vel!=null&&vel>=300)s="fast";
    else if(fresh)s="streak";else if(p>=3000)s="power";

  }
  const chipHtml=s=>`<span class="chip">${T().strengths[s.strength]}</span>`;

  function animateNum(node,to){if(!node)return;const from=parseInt((node.textContent||"0").replace(/,/g,""))||0;if(from===to){node.textContent=fmt(to);return;}const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/650);node.textContent=fmt(Math.round(from+(to-from)*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(s);})(t0);}
  function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;el("toasts").appendChild(d);setTimeout(()=>d.remove(),4000);}
  function moveBadge(uid,rank){const p=prevRank[uid];if(p==null)return firstLoad?'<span class="same">·</span>':'<span class="newp">NEW</span>';if(p>rank)return `<span class="up">▲${p-rank}</span>`;if(p<rank)return `<span class="down">▼${rank-p}</span>`;return '<span class="same">·</span>';}

  // ── confetti ──
  const cvs=el("confetti"),ctx=cvs.getContext("2d");let parts=[],raf=null;
  function rz(){cvs.width=innerWidth;cvs.height=innerHeight;}rz();addEventListener("resize",rz);
  function burst(n=100){const cols=["#0F5A3E","#C5A35A","#E9C349","#083525","#CBA24C","#1A5C3A"];for(let i=0;i<n;i++)parts.push({x:innerWidth*(.3+Math.random()*.4),y:-20,vx:(Math.random()-.5)*9,vy:Math.random()*4+2,g:.16,s:6+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]});if(!raf)loop();}
  function loop(){ctx.clearRect(0,0,cvs.width,cvs.height);parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);ctx.restore();});parts=parts.filter(p=>p.y<cvs.height+30);if(parts.length)raf=requestAnimationFrame(loop);else{raf=null;ctx.clearRect(0,0,cvs.width,cvs.height);}}

  // ── static chrome (re-applied on language switch) ──

  // ══ THE FOREST SCENE ══
  // Each player is a tree: height grows with points, species richens with tier.
  // Sky follows the real local time; flowers on the grass = campus bottles saved.
  const SKY={
    day:{top:"#CDE9DB",bot:"#EEF6EC",hillB:"#CBE0CD",hillF:"#B7D6BD",grass:"#A9CFAF",mound:"#B6D8BC",overlay:0},
    dawn:{top:"#F2DFC3",bot:"#EAF0E2",hillB:"#CBDECB",hillF:"#B4D2B8",grass:"#A5C9A9",mound:"#B2D2B6",overlay:0},
    dusk:{top:"#E8CBA9",bot:"#DDE7DB",hillB:"#B9D1BC",hillF:"#A3C4A8",grass:"#94B899",mound:"#A1C4A6",overlay:.04},
    night:{top:"#0E2433",bot:"#14342C",hillB:"#123A2D",hillF:"#0E2F25",grass:"#0B281F",mound:"#0F2E24",overlay:.10}};
  function skyMode(){const h=new Date().getHours();return h>=19||h<5?"night":h<7?"dawn":h>=17?"dusk":"day";}
  const CANOPY=["#1C6B4C","#15654A","#0F5A3E","#2E7D5B","#247253"];

  function treeSvg(r,rank,x,baseY){
    const p=r.points||0,h0=hash(r.uid+(r.name||"")),ti=TIERS.indexOf(tier(p));
    const H=Math.min(128,30+Math.sqrt(p)*1.55);           // tree height from points
    const cw=Math.max(16,H*.52);                          // canopy radius
    const cA=CANOPY[h0%CANOPY.length],cB=CANOPY[(h0+2)%CANOPY.length];
    const sway=(3.2+h0%3)+"s";
    const nm=esc((r.name||"—").slice(0,10));
    const grewNow=gained.has(r.uid)?" cheer":"";
    const growIn=!booted?" grow":"";
    let body;
    if(p<100){ // seedling
      body=`<path d="M0 0 C0 -10 0 -16 0 -22" stroke="#4C8A3F" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="-7" cy="-22" rx="8" ry="4.5" fill="#5D8A3C" transform="rotate(-28 -7 -22)"/>
        <ellipse cx="7" cy="-26" rx="8" ry="4.5" fill="#4C8A3F" transform="rotate(24 7 -26)"/>`;
    }else{
      const trunkW=Math.max(4,H*.09);
      body=`<path d="M${-trunkW/2} 0 Q${-trunkW*.35} ${-H*.5} ${-trunkW*.22} ${-H*.72} L${trunkW*.22} ${-H*.72} Q${trunkW*.35} ${-H*.5} ${trunkW/2} 0 Z" fill="#6B4E32"/>
        <circle cx="${-cw*.45}" cy="${-H*.68}" r="${cw*.62}" fill="${cB}"/>
        <circle cx="${cw*.45}" cy="${-H*.66}" r="${cw*.58}" fill="${cA}"/>
        <circle cx="0" cy="${-H*.88}" r="${cw*.68}" fill="${cA}"/>
        <circle cx="0" cy="${-H*.80}" r="${cw*.40}" fill="${cB}" opacity=".55"/>`;
      if(ti>=4){ // champion+: golden fruit
        for(let f=0;f<5;f++){const fx=((h0>>f)%2?-1:1)*(cw*.15+((h0>>(f+1))%40)/100*cw*.5),fy=-H*.66-((h0>>(f+2))%50)/100*cw*.7;
          body+=`<circle cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="3.2" fill="#E9C349" stroke="#A9832F" stroke-width=".8"/>`;}
      }
      if(ti>=5){ // legend: halo
        body+=`<circle cx="0" cy="${-H*.8}" r="${cw*.95}" fill="none" stroke="#E9C349" stroke-width="1.4" opacity=".5" stroke-dasharray="3 6"/>`;
      }
    }
    const badge=rank<=3?`${rank===1?`<path class="crown" d="M-9 ${-(H+40)} L-5.5 ${-(H+50)} L0 ${-(H+43)} L5.5 ${-(H+50)} L9 ${-(H+40)} Z" fill="#E9C349" stroke="#A9832F" stroke-width="1"/>`:""}
      <circle cx="0" cy="${-(H+26)}" r="10" fill="${rank===1?"#E9C349":rank===2?"#B4BDC6":"#CBA24C"}" stroke="${rank===1?"#A9832F":rank===2?"#8D97A3":"#A9832F"}" stroke-width="1.2"/>
      <text x="0" y="${-(H+22)}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${rank}</text>`:"";
    return `<g class="tree${growIn}${grewNow}" data-uid="${esc(r.uid)}" transform="translate(${x.toFixed(1)},${baseY})" style="--sw:${sway}">
      <ellipse cx="0" cy="3" rx="${Math.max(14,cw*.8)}" ry="5" fill="rgba(10,40,28,.16)"/>
      <g class="body">${body}${badge}</g>
      <rect x="-34" y="12" width="68" height="17" rx="4" fill="#8A6A45" stroke="#6B4E32" stroke-width="1"/>
      <text x="0" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#F6EFDF">${nm}</text>
    </g>`;
  }

  function sceneSvg(rows){
    const mode=skyMode(),S=SKY[mode],W=1000;
    const shown=rows.slice(0,12);
    const n=shown.length,spacing=Math.min(150,(W-160)/Math.max(1,n));
    // rank 1 in the middle, others fanning outwards; top 3 stand on podium mounds
    const moundLift=r=>r===1?20:r===2?13:r===3?8:0;
    const placed=shown.map((r,i)=>{
      const off=Math.ceil(i/2)*(i%2?-1:1);
      const jitter=(hash(r.uid)%25)-12;
      return {r,rank:i+1,x:W/2+off*spacing+jitter};
    });
    const mounds=placed.filter(t=>t.rank<=3).map(t=>{
      const rx=t.rank===1?88:t.rank===2?72:60,ry=moundLift(t.rank)+10;
      return `<ellipse class="mound" cx="${t.x.toFixed(1)}" cy="412" rx="${rx}" ry="${ry}" fill="${S.mound}"/>`;
    }).join("");
    const trees=placed.sort((a,b)=>a.x-b.x).map(t=>treeSvg(t.r,t.rank,t.x,408-moundLift(t.rank))).join("");

    const total=rows.reduce((a,r)=>a+(r.points||0),0);
    const flowers=Math.min(26,Math.round(total*BOTTLE_SHARE/POINTS_PER_BOTTLE/120));
    let flora="";
    for(let i=0;i<flowers;i++){
      const fx=30+(i*137)%940,fy=432+(i*53)%22,fc=["#E9C349","#F6EFDF","#CBA24C"][i%3];
      flora+=`<g><line x1="${fx}" y1="${fy+6}" x2="${fx}" y2="${fy}" stroke="#4C8A3F" stroke-width="1.4"/><circle cx="${fx}" cy="${fy-2}" r="2.6" fill="${fc}"/></g>`;

      sky+=`<circle cx="860" cy="70" r="26" fill="#EAF0E2"/><circle cx="872" cy="62" r="24" fill="${S.top}"/>`;
      for(let i=0;i<14;i++){const sx=(i*211)%W,sy=20+(i*67)%120;

    }else{
      sky+=`<circle cx="150" cy="84" r="52" fill="#F7D774" opacity=".28"/><circle cx="150" cy="84" r="32" fill="${mode==="day"?"#F7D774":"#F2B95C"}"/>`;
      sky+=`<g class="cloud" style="animation-duration:75s"><ellipse cx="0" cy="70" rx="46" ry="15" fill="#fff" opacity=".65"/><ellipse cx="34" cy="62" rx="30" ry="12" fill="#fff" opacity=".65"/></g>
        <g class="cloud" style="animation-duration:110s;animation-delay:-40s"><ellipse cx="0" cy="130" rx="56" ry="16" fill="#fff" opacity=".5"/><ellipse cx="40" cy="122" rx="32" ry="12" fill="#fff" opacity=".5"/></g>
        <g class="fly" style="animation-duration:38s"><g class="flut"><ellipse cx="-4" cy="150" rx="5" ry="3.4" fill="#C5A35A"/><ellipse cx="4" cy="150" rx="5" ry="3.4" fill="#E9C349"/></g></g>
        <g class="fly" style="animation-duration:55s;animation-delay:-20s"><path d="M0 100 q7 -8 14 0 q7 -8 14 0" stroke="#5A6B5E" stroke-width="2" fill="none" stroke-linecap="round"/></g>`;
    }

    return `<svg viewBox="0 0 ${W} 470" preserveAspectRatio="xMidYMax meet" role="img">
      <defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${S.top}"/><stop offset="1" stop-color="${S.bot}"/></linearGradient></defs>
      <rect width="${W}" height="470" fill="url(#skyg)"/>
      ${sky}
      <path d="M0 330 Q170 270 360 316 T720 306 T1000 322 L1000 470 L0 470 Z" fill="${S.hillB}"/>
      <path d="M0 372 Q220 330 480 362 T1000 358 L1000 470 L0 470 Z" fill="${S.hillF}"/>
      <rect y="408" width="${W}" height="62" fill="${S.grass}"/>
      ${mounds}
      ${flora}
      ${trees}
      ${S.overlay?`<rect width="${W}" height="470" fill="#04140D" opacity="${S.overlay}"/>`:""}
    </svg>`;
  }

  // ── render ──
  function rowHtml(r,rank,hit){
    const grew=!firstLoad&&prevPoints[r.uid]!=null&&r.points>prevPoints[r.uid];
    const st=pstats(r);
    const above=rank>1?lastRows[rank-2]:null,gap=above?above.points-r.points:0;
    const chase=above?(gap===0?T().tiedWith(esc(first(above.name))):T().catchUp(fmt(gap),esc(first(above.name)))):T().front;
    const pct=above&&above.points>0?Math.min(100,Math.round((r.points||0)/above.points*100)):100;
    return `<div class="row ${grew?'flash':''} ${hit?'hit':''}" data-uid="${esc(r.uid)}">
      <div class="r-rank">${rank<=3?`<span class="disc d${rank}">${rank}</span>`:rank}</div>
      <div class="r-move">${moveBadge(r.uid,rank)}</div>
      <div class="r-ava" style="background:${color(r.name)}">${initial(r.name)}</div>
      <div class="r-main">
        <div class="r-top"><b>${esc(r.name||"—")}</b>${chipHtml(st)}</div>
        <div class="r-sub">${T().bottlesLine(fmt(st.bottles),fmt(st.kg))} · ${chase}</div>
        <div class="meter"><i style="width:${pct}%"></i></div>
      </div>
      <div class="r-pts">${fmt(r.points)}<small>${T().pts}</small></div>
    </div>`;
  }
  function renderRows(){
    const rows=lastRows;
    if(query){
      const q=query.toLowerCase();
      const hits=rows.map((r,i)=>({r,rank:i+1})).filter(x=>(x.r.name||"").toLowerCase().includes(q));
      el("rows").innerHTML=hits.length?hits.map(x=>rowHtml(x.r,x.rank,true)).join(""):`<div class="empty">${T().noMatch}</div>`;
      return;
    }
    el("rows").innerHTML=rows.map((r,i)=>rowHtml(r,i+1,false)).join("");
  }
  function render(rows){
    if(!rows.length){el("state").style.display="block";el("main").style.display="none";el("state").textContent=T().noPlayers;return;}
    const sig=JSON.stringify(rows.map(r=>[r.uid,r.name,r.points,r.updatedAt]))+lang;
    if(sig===lastSig&&booted){lastUpdate=Date.now();return;}
    el("state").style.display="none";el("main").style.display="grid";

    gained=new Set();
    if(!firstLoad){
      rows.forEach(r=>{const b=prevPoints[r.uid];if(b!=null&&r.points>b){toast(T().earnedT(first(r.name),fmt(r.points-b)));gained.add(r.uid);}});
      if(gained.size)burst(90);
      if(rows[0]&&prevLeader&&rows[0].uid!==prevLeader){toast(T().leadT(first(rows[0].name)));burst(150);}
    }

    lastRows=rows;
    el("scene").innerHTML=sceneSvg(rows);

    const total=rows.reduce((a,r)=>a+(r.points||0),0),kg=Math.round(total*CO2_PER_POINT),bt=Math.round(total*BOTTLE_SHARE/POINTS_PER_BOTTLE);
    el("stats").innerHTML=`
      <div class="stat card"><div class="ic">${ICONS.users}</div><div style="min-width:0"><div class="v" id="s1">0</div><div class="l">${T().competing}</div></div></div>
      <div class="stat card"><div class="ic">${ICONS.bolt}</div><div style="min-width:0"><div class="v" id="s2">0</div><div class="l">${T().totalPts}</div></div></div>
      <div class="stat card"><div class="ic">${ICONS.bottle}</div><div style="min-width:0"><div class="v" id="s3">0</div><div class="l">${T().bottlesT}</div></div></div>
      <div class="stat card"><div class="ic">${ICONS.globe}</div><div style="min-width:0"><div class="v" id="s4">0</div><div class="l">${T().co2}</div></div></div>`;
    animateNum(el("s1"),rows.length);animateNum(el("s2"),total);animateNum(el("s3"),bt);animateNum(el("s4"),kg);
    tickerData=T().ticker({bt:fmt(bt),kg:fmt(kg),ph:fmt(kg*120),km:fmt(kg*6)});

    // race banner (#1 vs #2) + closest-battle ticker line
    if(rows[1]){
      const gap12=rows[0].points-rows[1].points,a=esc(first(rows[0].name)),b=esc(first(rows[1].name));
      el("race").style.display="flex";
      el("race").innerHTML=`<span class="flag">🏁</span><span>${gap12===0?T().raceTied(a,b,fmt(rows[0].points)):T().raceGap(b,fmt(gap12),a)}</span>`;
      let bi=1,bg=Infinity;
      for(let i=1;i<rows.length;i++){const g=rows[i-1].points-rows[i].points;if(g<bg){bg=g;bi=i;}}
      const x=esc(first(rows[bi-1].name)),y=esc(first(rows[bi].name));
      tickerData.push(bg===0?T().battleTied(x,y):T().battle(x,y,fmt(bg)));
    }else{el("race").style.display="none";}

    renderRows();
    if(sheetUid)fillSheet();

    prevPoints={};prevRank={};rows.forEach((r,i)=>{prevPoints[r.uid]=r.points;prevRank[r.uid]=i+1;});
    prevLeader=rows[0]?rows[0].uid:null;firstLoad=false;booted=true;lastSig=sig;lastUpdate=Date.now();el("updated").textContent=T().updatedNow;
  }

  // ── player sheet ──
  function fillSheet(){
    const i=lastRows.findIndex(r=>r.uid===sheetUid);
    if(i<0){closeSheet();return;}
    const r=lastRows[i],rank=i+1,t=tier(r.points||0),pr=progress(r.points||0),act=ago(r.updatedAt);
    const st=pstats(r);
    const ladder=TIERS.map((x,xi)=>{
      const done=r.points>=(TIERS[xi+1]?TIERS[xi+1].min:Infinity);
      const cur=t===x;
      const fill=done?100:(cur?Math.max(6,pr.pct):0);
      return `<div class="lad-seg ${done?'done':''} ${cur?'cur':''}" title="${tname(x)}">
        <div class="bar"><i style="width:${fill}%;background:${x.c}"></i></div><span class="dot2" style="background:${x.c}"></span></div>`;
    }).join("");
    el("sheet").innerHTML=`
      <div class="sh-top">
        <div class="sh-ava" style="background:${color(r.name)}">${initial(r.name)}</div>
        <div class="sh-id"><b>${esc(r.name||"—")}</b><div style="margin-top:4px">${tierPill(r.points||0)} ${chipHtml(st)}</div></div>
        <button class="sh-x" id="sh-x">✕</button>
      </div>
      <div class="sh-grid">
        <div class="sh-cell"><div class="v">#${rank}</div><div class="l">${T().rank}</div></div>
        <div class="sh-cell"><div class="v" style="color:var(--green)">${fmt(r.points)}</div><div class="l">${T().points}</div></div>
        <div class="sh-cell"><div class="v" style="font-size:13px;line-height:2.1">${act||"—"}</div><div class="l">${T().lastActive}</div></div>
        <div class="sh-cell"><div class="v">${fmt(st.bottles)}</div><div class="l">${T().bottlesL}</div></div>
        <div class="sh-cell"><div class="v">${fmt(st.kg)}</div><div class="l">${T().co2L}</div></div>
        <div class="sh-cell"><div class="v" style="font-size:13px;line-height:2.1">${T().strengths[st.strength]}</div><div class="l">${T().strengthL}</div></div>
      </div>
      <div class="sh-cap">${T().journey}</div><div class="lad">${ladder}</div>
      <div class="sh-cap" style="margin-top:16px">${T().insightCap}</div>
      <div class="sh-insight">${T().insight(esc(first(r.name)),{vel:st.vel!=null?fmt(st.vel):null,bottles:fmt(st.bottles),kg:fmt(st.kg),km:fmt(st.kg*6)})}</div>
      <div class="sh-cap" style="margin-top:16px">${T().raceCap}</div>
      <div class="sh-insight" style="background:var(--amber-t);border-color:var(--amber-b);color:var(--amber-d)">${(()=>{
        const parts=[];
        const above=rank>1?lastRows[rank-2]:null;
        parts.push(above?(above.points===r.points?T().tiedWith(esc(first(above.name))):T().catchUp(fmt(above.points-r.points),esc(first(above.name)))):T().front);
        const below=lastRows[rank];
        if(below)parts.push(T().behindYou(esc(first(below.name)),fmt(r.points-below.points)));
        return parts.join(" · ");
      })()}</div>`;
    el("sh-x").onclick=closeSheet;
  }
  function openSheet(uid){sheetUid=uid;fillSheet();el("ov").classList.add("open");}
  function closeSheet(){sheetUid=null;el("ov").classList.remove("open");}
  el("ov").onclick=e=>{if(e.target===el("ov"))closeSheet();};
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
  function findUid(node,container){let n=node;while(n&&n!==container){if(n.dataset&&n.dataset.uid)return n.dataset.uid;n=n.parentNode;}return null;}
  el("rows").addEventListener("click",e=>{const u=findUid(e.target,el("rows"));if(u)openSheet(u);});
  el("scene").addEventListener("click",e=>{const u=findUid(e.target,el("scene"));if(u)openSheet(u);else burst(24);});

  // hover sync: list row <-> its tree in the forest
  el("rows").addEventListener("mouseover",e=>{const u=findUid(e.target,el("rows"));if(!u)return;const t=el("scene").querySelector(`[data-uid="${u}"]`);if(t)t.classList.add("lit");});
  el("rows").addEventListener("mouseout",e=>{const u=findUid(e.target,el("rows"));if(!u)return;const t=el("scene").querySelector(`[data-uid="${u}"]`);if(t)t.classList.remove("lit");});

  // ── search ──
  let qTimer=null;
  el("q").addEventListener("input",e=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=e.target.value.trim();renderRows();},140);});

  // ── language toggle ──
  el("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("psaux_lang",lang);}catch(e){}chrome();lastSig="";if(lastRows.length)render(lastRows);};

  // ── data: anonymous auth + Firestore REST (polled) ──
  async function auth(){
    const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:'{"returnSecureToken":true}'});
    if(!r.ok) throw new Error("auth "+r.status);
    idToken=(await r.json()).idToken;
  }
  function parseDoc(d){const f=d.fields||{};const S=k=>(f[k]&&f[k].stringValue)||"";const N=k=>f[k]?parseInt(f[k].integerValue||Math.round(f[k].doubleValue||0)):0;const TS=k=>S(k)||(f[k]&&f[k].timestampValue)||"";return{uid:(d.name||"").split("/").pop(),name:S("name"),points:N("points"),level:S("level"),updatedAt:TS("updatedAt"),createdAt:TS("createdAt")};}
  async function fetchUsers(){
    if(!idToken) await auth();
    const url=`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/users?pageSize=100`;
    let r=await fetch(url,{headers:{Authorization:"Bearer "+idToken}});
    if(r.status===401){await auth();r=await fetch(url,{headers:{Authorization:"Bearer "+idToken}});}
    if(!r.ok) throw new Error("read "+r.status);
    const rows=((await r.json()).documents||[]).map(parseDoc);
    rows.sort((a,b)=>(b.points||0)-(a.points||0));
    return rows.slice(0,20);
  }
  async function tick(){
    try{ render(await fetchUsers()); fails=0; }
    catch(e){ fails++; console.error(e);
      if(firstLoad||fails>=3){ el("main").style.display="none"; const s=el("state"); s.style.display="block";
        s.innerHTML=T().cantReach+"<small>"+T().cantReachSub+" ("+esc(e.message||"error")+")</small>"; }
    }
  }

  // ── chrome: clock, updated-ago, ticker, fullscreen, hourly sky refresh ──
  function clockTick(){el("clock").textContent=new Date().toLocaleTimeString(lang==="ar"?"ar-SA":[],{hour:"2-digit",minute:"2-digit"});}
  chrome();clockTick();tick();
  setInterval(tick,POLL_MS);setInterval(clockTick,15e3);
  setInterval(()=>{if(booted&&lastRows.length)el("scene").innerHTML=sceneSvg(lastRows);},18e5); // sky follows the clock
  setInterval(()=>{if(!lastUpdate)return;const s=Math.floor((Date.now()-lastUpdate)/1000);el("updated").textContent=s<3?T().updatedNow:(s<60?T().updatedS(s):T().updatedM(Math.floor(s/60)));},1000);
  setInterval(()=>{if(!tickerData.length)return;tickIdx=(tickIdx+1)%tickerData.length;const t=el("ticker");t.classList.remove("show");setTimeout(()=>{t.innerHTML=tickerData[tickIdx];t.classList.add("show");},380);},6500);
  el("fs").onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else d.requestFullscreen&&d.requestFullscreen();};
</script>
</body>
</html>
