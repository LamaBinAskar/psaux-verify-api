<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#F2EEE3" />
<title>PSAUx Champions — Live Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ff:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --paper:#F2EEE3;--card:#FFFDF7;--line:#E3DCCA;--line-2:#D8D0BA;
    --ink:#1F2D24;--ink2:#5C6B5F;--ink3:#9AA08F;
    --green:#146C43;--green-d:#0E3B2C;--green-t:#EAF2E4;
    --amber:#B08900;--amber-d:#8A6D1C;--amber-t:#F5E9C8;--amber-b:#E4D194;--r:20px}
  [dir=rtl]{--ff:"IBM Plex Sans Arabic","Space Grotesk",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;font-family:var(--ff)}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(90% 55% at 50% -8%,rgba(20,108,67,.07),transparent 70%)}
  #confetti{position:fixed;inset:0;z-index:60;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:22px 28px 24px;min-height:100vh;display:flex;flex-direction:column}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(31,45,36,.04),0 10px 28px rgba(31,45,36,.06)}
  svg{display:block}

  /* ── header ── */
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .brand img{height:52px}
  .brand .k{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--green);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [dir=rtl] .brand .k{letter-spacing:0}
  .brand h2{font-size:29px;font-weight:700;line-height:1.08;color:var(--green-d);letter-spacing:-.5px;white-space:nowrap}
  [dir=rtl] .brand h2{letter-spacing:0}
  .hright{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:9px 14px;border-radius:30px;font-weight:600;font-size:13.5px;color:var(--ink)}
  .clock{font-variant-numeric:tabular-nums}
  .dot{width:9px;height:9px;border-radius:50%;background:#1F9D55;box-shadow:0 0 0 0 rgba(31,157,85,.5);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,85,.45)}70%{box-shadow:0 0 0 12px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
  .ctrl{height:40px;border-radius:30px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;padding:0 14px;transition:background .15s,transform .15s}
  .ctrl:hover{background:#ECE7D8}
  .ctrl:active{transform:scale(.96)}
  .ctrl.icon{width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  .updated{position:absolute;top:82px;inset-inline-end:28px;font-size:12px;color:var(--ink3);font-weight:500}

  .main{display:grid;grid-template-columns:1.2fr .95fr;gap:20px;flex:1;min-height:0}
  @media (max-width:900px){.main{grid-template-columns:1fr}}

  /* ── podium ── */
  .arena{display:flex;flex-direction:column;min-height:0}
  .podium{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:16px;padding:14px 14px 0;min-height:0}
  .pod{display:flex;flex-direction:column;align-items:center;text-align:center;width:31%;min-width:0;cursor:pointer;transition:transform .2s}
  .pod:hover{transform:translateY(-4px)}
  .pod:active{transform:scale(.97)}
  .p-flag{font-size:10px;letter-spacing:1.6px;font-weight:700;color:var(--amber-d);background:var(--amber-t);border:1px solid var(--amber-b);padding:4px 11px;border-radius:20px;margin-bottom:8px;text-transform:uppercase;white-space:nowrap}
  [dir=rtl] .p-flag{letter-spacing:0}
  .p-ava{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff;border:3px solid #fff;box-shadow:0 8px 22px rgba(31,45,36,.18);margin-bottom:9px}
  .p1 .p-ava{width:104px;height:104px;font-size:40px;border-color:#D9B23A;box-shadow:0 0 0 5px var(--amber-t),0 10px 26px rgba(31,45,36,.2)}
  .p-nm{font-size:17.5px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p1 .p-nm{font-size:22px}
  .tier{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-pts{font-size:25px;font-weight:700;color:var(--green);margin:7px 0 3px;line-height:1;font-variant-numeric:tabular-nums}
  .p1 .p-pts{font-size:33px}
  .p-pts small{font-size:12px;color:var(--ink3);font-weight:600}
  .p-sub{font-size:11px;color:var(--ink2);font-weight:500;margin-bottom:9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-tied{font-size:11px;font-weight:700;color:var(--amber-d);margin:-4px 0 8px}
  .p-block{position:relative;width:100%;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:center;border:1px solid;border-bottom:none}
  .p1 .p-block{height:124px;background:linear-gradient(180deg,#F7EBC7,#F2E3AE);border-color:var(--amber-b)}
  .p2 .p-block{height:90px;background:linear-gradient(180deg,#EDEBE4,#E4E1D6);border-color:#D6D2C4}
  .p3 .p-block{height:70px;background:linear-gradient(180deg,#F0E3D3,#E9D7C0);border-color:#DCC5A4}
  .p-block span{font-size:40px;font-weight:700;color:rgba(31,45,36,.22);font-variant-numeric:tabular-nums}
  .p1 .p-block span{font-size:54px;color:rgba(138,109,28,.30)}
  .rise .p-block{animation:rise .8s cubic-bezier(.2,1.1,.35,1) backwards;transform-origin:bottom}
  .rise .p-ava,.rise .p-nm{animation:fadeup .7s ease .25s backwards}
  @keyframes rise{from{transform:scaleY(0)}}
  @keyframes fadeup{from{opacity:0;transform:translateY(10px)}}
  .floor{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--line-2),transparent);margin:0 6px}

  .stats{display:flex;gap:10px;margin-top:14px}
  .stat{flex:1;min-width:0;padding:11px 12px;display:flex;align-items:center;gap:10px;border-radius:16px}
  .stat .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--green-t);color:var(--green);flex:0 0 auto}
  .stat .v{font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:10px;color:var(--ink2);font-weight:600;margin-top:3px}

  /* ── ranking list ── */
  .list{padding:10px;overflow:hidden;min-height:0;display:flex;flex-direction:column}
  .cap{display:flex;align-items:center;gap:10px;padding:4px 6px 10px}
  .cap .tt{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--ink3)}
  [dir=rtl] .cap .tt{letter-spacing:0}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:#F4F0E4;border:1px solid var(--line);border-radius:13px;padding:8px 12px;color:var(--ink3);transition:border-color .2s}
  .search:focus-within{border-color:var(--green)}
  .search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-size:14px;font-weight:500}
  .search input::placeholder{color:var(--ink3)}
  #rows{overflow:auto;flex:1;min-height:0}
  .row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:15px;cursor:pointer;transition:background .15s,transform .15s;border:1px solid transparent}
  .row:hover{background:#F6F2E6;transform:translateY(-1px)}
  .row:active{transform:scale(.99)}
  .row+.row{margin-top:3px}
  .row.flash{animation:flash 2.4s ease-out}
  .row.hit{border-color:var(--amber-b);background:#FBF3DC}
  @keyframes flash{0%{background:var(--amber-t)}100%{background:transparent}}
  .r-rank{width:30px;display:flex;justify-content:center;font-weight:700;font-size:17px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .disc{width:27px;height:27px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(31,45,36,.2)}
  .d1{background:linear-gradient(180deg,#E3BC45,#C79B26)}
  .d2{background:linear-gradient(180deg,#BFC6CE,#98A2AD)}
  .d3{background:linear-gradient(180deg,#CE9765,#B3763F)}
  .r-move{width:26px;font-size:12px;font-weight:700;text-align:center;flex:0 0 auto}
  .up{color:#1F7A3D}.down{color:#C0402A}.same{color:#C9C2AE}.newp{color:var(--amber)}
  .r-ava{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;flex:0 0 auto}
  .r-main{flex:1;min-width:0}
  .r-top{display:flex;align-items:center;gap:8px;min-width:0}
  .r-top b{font-size:16.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{font-size:10.5px;font-weight:700;color:var(--green);background:var(--green-t);border-radius:20px;padding:3px 9px;white-space:nowrap;flex:0 0 auto}
  .r-sub{font-size:12px;color:var(--ink2);font-weight:500;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-pts{font-weight:700;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .r-pts small{font-size:11px;color:var(--ink3);font-weight:600;margin-inline-start:3px}
  .empty{padding:26px 16px;text-align:center;color:var(--ink2);font-weight:500;font-size:14px}

  /* ── player sheet ── */
  #ov{position:fixed;inset:0;z-index:50;background:rgba(24,32,26,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  #ov.open{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:22px 24px 28px;box-shadow:0 -18px 50px rgba(24,32,26,.25);animation:sheetup .32s cubic-bezier(.2,1.05,.35,1)}
  @keyframes sheetup{from{transform:translateY(60px);opacity:0}}
  @media (min-width:900px){#ov{align-items:center}.sheet{border-radius:24px;border-bottom:1px solid var(--line);animation:sheetpop .28s cubic-bezier(.2,1.1,.35,1)}@keyframes sheetpop{from{transform:scale(.95);opacity:0}}}
  .sh-top{display:flex;align-items:center;gap:15px}
  .sh-ava{width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;flex:0 0 auto}
  .sh-id{flex:1;min-width:0}
  .sh-id b{font-size:22px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sh-x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#F4F0E4;color:var(--ink2);font-size:14px;cursor:pointer;flex:0 0 auto}
  .sh-x:hover{background:#ECE7D8}
  .sh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
  .sh-cell{background:#F6F2E6;border:1px solid #E8E1CF;border-radius:15px;padding:11px 12px;text-align:center}
  .sh-cell .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .sh-cell .l{font-size:10.5px;color:var(--ink2);font-weight:600;margin-top:3px}
  .sh-cap{font-size:11px;letter-spacing:1.6px;font-weight:700;color:var(--ink3);margin-bottom:9px}
  [dir=rtl] .sh-cap{letter-spacing:0}
  .lad{display:flex;gap:5px}
  .lad-seg{flex:1;text-align:center}
  .lad-seg .bar{height:7px;border-radius:4px;background:#ECE6D6;overflow:hidden}
  .lad-seg .bar i{display:block;height:100%;border-radius:4px}
  .dot2{display:inline-block;width:9px;height:9px;border-radius:50%;margin-top:7px;opacity:.3}
  .lad-seg.done .dot2,.lad-seg.cur .dot2{opacity:1}
  .lad-seg.cur .dot2{transform:scale(1.45)}
  .sh-insight{margin-top:16px;background:var(--green-t);border:1px solid #D8E5CE;border-radius:15px;padding:13px 15px;font-size:13.5px;line-height:1.55;color:var(--green-d);font-weight:500}
  .sh-next{margin-top:12px;font-size:13px;font-weight:500;color:var(--ink2)}

  /* ── footer ── */
  footer{margin-top:15px;display:flex;align-items:center;gap:16px;font-size:13.5px}
  .ticker{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);opacity:0;transition:opacity .35s;text-align:center}
  .ticker.show{opacity:1}
  .ticker small{font-weight:500;color:var(--ink3)}
  .state{text-align:center;padding:70px 20px;color:var(--ink2);font-size:19px;font-weight:600}
  .state small{display:block;margin-top:12px;font-weight:400;font-size:14px;color:var(--ink3);max-width:560px;margin:12px auto 0;line-height:1.5}

  #toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
  .toast{background:var(--green-d);color:#F6F1DC;font-weight:600;font-size:16.5px;padding:13px 22px;border-radius:30px;box-shadow:0 12px 34px rgba(24,32,26,.3);animation:tpop .35s cubic-bezier(.2,1.3,.4,1),tout .4s ease 3.4s forwards}
  @keyframes tpop{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-14px) scale(.96)}}

  @media (max-width:900px){
    .brand h2{font-size:22px}.brand .k{font-size:9.5px}.clock{display:none}.updated{display:none}
    .podium{gap:10px}.p-ava{width:60px;height:60px;font-size:23px}.p1 .p-ava{width:80px;height:80px;font-size:30px}
    .p-nm{font-size:14px}.p1 .p-nm{font-size:17px}.p-pts{font-size:19px}.p1 .p-pts{font-size:25px}
    .p1 .p-block{height:88px}.p2 .p-block{height:64px}.p3 .p-block{height:50px}
    .stats{flex-wrap:wrap}.stat{flex:1 1 44%}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="confetti"></canvas>
<div id="toasts"></div>
<div class="updated" id="updated"></div>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="/emblem.png" alt="PSAUx" onerror="this.style.display='none'"/>
      <div style="min-width:0">
        <div class="k" id="h-kicker"></div>
        <h2 id="h-title"></h2>
      </div>
    </div>
    <div class="hright">
      <div class="pill clock" id="clock"></div>
      <div class="pill"><span class="dot"></span> <span id="h-live"></span></div>
      <button class="ctrl" id="lang"></button>
      <button class="ctrl icon" id="fs" title="Fullscreen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    </div>
  </header>

  <div class="main" id="main" style="display:none">
    <div class="arena">
      <div class="podium" id="podium"></div>
      <div class="floor"></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="list card">
      <div class="cap">
        <span class="tt" id="l-cap"></span>
        <label class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" autocomplete="off"/>
        </label>
      </div>
      <div id="rows"></div>
    </div>
  </div>
  <div id="state" class="state"></div>

  <footer>
    <div class="ticker show" id="ticker"></div>
  </footer>
</div>

<div id="ov"><div class="sheet" id="sheet"></div></div>

<script>
  // ── Reads Firestore over plain REST (no realtime SDK / no CDN) so it works on
  //    any network Google is reachable from; polls every few seconds. ──
  const KEY="AIzaSyDTZ4COIWrzmXZtC9uAsAUCNwHALOquvMM", PROJECT="psaux-26";
  const CO2_PER_POINT=0.05, POLL_MS=4000;
  // Bottle model: the PSAUx app awards 2 pts per scanned bottle; assume ~70% of
  // a player's points come from bottle scans (rest: challenges, volunteering).
  const POINTS_PER_BOTTLE=2, BOTTLE_SHARE=0.7;
  const PAL=["#3E7C50","#2E7D74","#B08900","#B15E36","#6D5CA8","#2C6E9E","#A8447C","#587A33","#0F7E7E","#8A6D3B"];
  const TIERS=[
    {min:0,n:"Active Contributor",ar:"المساهم النشط",c:"#5D8A3C"},
    {min:500,n:"Green Achiever",ar:"المنجز الأخضر",c:"#2E8B6A"},
    {min:1500,n:"Sustainability Advocate",ar:"مناصر الاستدامة",c:"#0F7E7E"},
    {min:3000,n:"Campus Changemaker",ar:"صانع التغيير",c:"#2C6E9E"},
    {min:5000,n:"PSAUx Champion",ar:"بطل PSAUx",c:"#B08900"},
    {min:8000,n:"Sustainability Legend",ar:"أسطورة الاستدامة",c:"#7A4FA8"}];
  const ICONS={
    users:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M15.5 3.13a4 4 0 0 1 0 7.75"/></svg>',
    bolt:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>',
    bottle:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4M10 2v3.2c0 .6-2.6 1.8-2.6 4V19a2.4 2.4 0 0 0 2.4 2.4h4.4A2.4 2.4 0 0 0 16.6 19V9.2c0-2.2-2.6-3.4-2.6-4V2"/></svg>',
    globe:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>'};

  const I18N={
    en:{kicker:"Prince Sattam University · Sustainability",title:"PSAUx Champions",live:"LIVE",cap:"THE RANKING",searchPh:"Find a player…",
      competing:"Competing",totalPts:"Total PSAUx points",bottlesT:"Bottles saved (est.)",co2:"kg CO₂ saved (est.)",pts:"pts",
      leaderTag:"Campus leader",champFlag:"Campus Leader",tiedLeader:"Tied with the leader",
      bottlesLine:(b,kg)=>`≈ ${b} bottles · ${kg} kg CO₂`,
      strengths:{leader:"Leads the board",fast:"Fast riser",streak:"Daily streak",power:"Big impact",steady:"Steady recycler",starter:"Just started"},
      insight:(n,s)=>`${n} ${s.vel!=null?`averages ≈ ${s.vel} pts a day since joining, and `:""}has kept ≈ ${s.bottles} bottles out of landfill — about ${s.kg} kg of CO₂ avoided, like ${s.km} km not driven by car.`,
      agoNow:"active now",agoM:m=>`active ${m}m ago`,agoH:h=>`active ${h}h ago`,agoD:d=>`active ${d}d ago`,
      connecting:"Connecting to the campus leaderboard…",noPlayers:"No players yet — be the first to earn PSAUx points!",
      allPodium:"Everyone's on the podium — earn PSAUx points in the app and join the chase!",noMatch:"No player matches your search.",
      cantReach:"Couldn't reach the leaderboard.",cantReachSub:"Check the network connection. If it persists, confirm Firestore allows reading <b>users</b> for signed-in clients.",
      updatedNow:"Updated just now",updatedS:s=>`Updated ${s}s ago`,updatedM:m=>`Updated ${m}m ago`,
      rank:"Rank",points:"PSAUx points",bottlesL:"Bottles (est.)",co2L:"kg CO₂ (est.)",lastActive:"Last active",strengthL:"Good at",
      journey:"LEVEL JOURNEY",insightCap:"AI INSIGHT · ESTIMATED FROM ACCOUNT DATA",
      earnedT:(n,p)=>`${n} earned +${p} pts`,leadT:n=>`${n} takes the lead!`,
      ticker:x=>["Earn PSAUx points at any station, in the app, and by volunteering.",
        `Together the campus has saved ≈ ${x.bt} bottles from landfill <small>· est.</small>`,
        `That's ≈ ${x.kg} kg of CO₂ avoided <small>· est.</small>`,
        `The clean energy of ≈ ${x.ph} phone charges`,`Or ≈ ${x.km} km not driven by car`,
        "Every bottle counts — scan, sort, climb the board."]},
    ar:{kicker:"جامعة الأمير سطام بن عبدالعزيز · الاستدامة",title:"أبطال PSAUx",live:"مباشر",cap:"الترتيب",searchPh:"ابحث عن لاعب…",
      competing:"مشارِك",totalPts:"مجموع نقاط PSAUx",bottlesT:"عبوات موفَّرة (تقديري)",co2:"كجم CO₂ موفَّرة (تقديري)",pts:"نقطة",
      leaderTag:"متصدر الحرم الجامعي",champFlag:"متصدر الحرم",tiedLeader:"تعادل مع المتصدر",
      bottlesLine:(b,kg)=>`≈ ${b} عبوة · ${kg} كجم CO₂`,
      strengths:{leader:"يتصدر اللوحة",fast:"صاعد بسرعة",streak:"مواظب يومياً",power:"تأثير كبير",steady:"منتظم في التدوير",starter:"بدأ للتو"},
      insight:(n,s)=>`${n} ${s.vel!=null?`بمعدل ≈ ${s.vel} نقطة يومياً منذ الانضمام، و`:""}أنقذ ≈ ${s.bottles} عبوة من المكب — أي ≈ ${s.kg} كجم CO₂ تم تجنبها، مثل ${s.km} كم لم تُقطع بالسيارة.`,
      agoNow:"نشط الآن",agoM:m=>`نشط قبل ${m} د`,agoH:h=>`نشط قبل ${h} س`,agoD:d=>`نشط قبل ${d} يوم`,
      connecting:"جارٍ الاتصال بلوحة الصدارة…",noPlayers:"لا يوجد لاعبون بعد — كن أول من يكسب نقاط PSAUx!",
      allPodium:"الجميع على المنصة — اكسب نقاط PSAUx من التطبيق وانضم للسباق!",noMatch:"لا يوجد لاعب بهذا الاسم.",
      cantReach:"تعذّر الوصول إلى لوحة الصدارة.",cantReachSub:"تحقق من اتصال الشبكة. إذا استمرت المشكلة تأكد من صلاحيات القراءة في Firestore.",
      updatedNow:"حُدِّثت الآن",updatedS:s=>`حُدِّثت قبل ${s} ث`,updatedM:m=>`حُدِّثت قبل ${m} د`,
      rank:"المركز",points:"نقاط PSAUx",bottlesL:"عبوات (تقديري)",co2L:"كجم CO₂ (تقديري)",lastActive:"آخر نشاط",strengthL:"يجيد",
      journey:"رحلة المستويات",insightCap:"تحليل ذكي · تقديري من بيانات الحساب",
      earnedT:(n,p)=>`${n} كسب +${p} نقطة`,leadT:n=>`${n} في الصدارة!`,
      ticker:x=>["اكسب نقاط PSAUx من المحطات ومن التطبيق وبالتطوع.",
        `أنقذ الحرم الجامعي معاً ≈ ${x.bt} عبوة من المكب <small>· تقديري</small>`,
        `أي ≈ ${x.kg} كجم CO₂ تم تجنبها <small>· تقديري</small>`,
        `ما يعادل طاقة ≈ ${x.ph} شحنة هاتف نظيفة`,`أو ≈ ${x.km} كم لم تُقطع بالسيارة`,
        "كل عبوة تُحتسب — امسح وصنّف وتصدّر اللوحة."]}};
  let lang="en";try{lang=localStorage.getItem("psaux_lang")||"en";}catch(e){}
  const T=()=>I18N[lang];
  const tname=t=>lang==="ar"?t.ar:t.n;

  let prevPoints={},prevRank={},firstLoad=true,booted=false,lastSig="",lastUpdate=0,prevLeader=null,idToken=null,fails=0;
  let lastRows=[],query="",tickerData=[],tickIdx=0,sheetUid=null;

  const el=id=>document.getElementById(id);
  const initial=n=>((n||"?").trim().charAt(0)||"?").toUpperCase();
  const first=n=>(n||"?").trim().split(" ")[0];
  const esc=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt=n=>(n||0).toLocaleString("en-US");
  function color(name){let h=0;const s=(name||"?");for(let i=0;i<s.length;i++)h=(h*33+s.charCodeAt(i))>>>0;return PAL[h%PAL.length];}
  function tier(p){let t=TIERS[0];for(const x of TIERS)if(p>=x.min)t=x;return t;}
  function tierPill(p){const t=tier(p);return `<span class="tier" style="background:${t.c}1A;color:${t.c}">${tname(t)}</span>`;}
  function progress(p){const i=TIERS.findIndex(t=>p<t.min);if(i<0)return{pct:100};const lo=TIERS[i-1].min,hi=TIERS[i].min;return{pct:Math.max(4,Math.round((p-lo)/(hi-lo)*100))};}
  function ago(iso){if(!iso)return"";const s=(Date.now()-Date.parse(iso))/1e3;if(!(s>=0))return"";if(s<90)return T().agoNow;if(s<3600)return T().agoM(Math.floor(s/60));if(s<86400)return T().agoH(Math.floor(s/3600));return T().agoD(Math.floor(s/86400));}

  // Per-player insight engine — derived from the account's real fields:
  // points, createdAt (rate of earning), updatedAt (recency), and rank.
  function pstats(r,rank){
    const p=r.points||0;
    const kg=Math.round(p*CO2_PER_POINT);
    const bottles=Math.round(p*BOTTLE_SHARE/POINTS_PER_BOTTLE);
    const days=r.createdAt&&Date.parse(r.createdAt)?Math.max(1,Math.round((Date.now()-Date.parse(r.createdAt))/864e5)):null;
    const vel=days?Math.round(p/days):null;
    const fresh=r.updatedAt&&(Date.now()-Date.parse(r.updatedAt))<1728e5;
    let s="steady";
    if(rank===1)s="leader";else if(p<100)s="starter";else if(vel!=null&&vel>=300)s="fast";
    else if(fresh)s="streak";else if(p>=3000)s="power";
    return {kg,bottles,vel,fresh,strength:s};
  }
  const chipHtml=s=>`<span class="chip">${T().strengths[s.strength]}</span>`;

  function animateNum(node,to){if(!node)return;const from=parseInt((node.textContent||"0").replace(/,/g,""))||0;if(from===to){node.textContent=fmt(to);return;}const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/650);node.textContent=fmt(Math.round(from+(to-from)*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(s);})(t0);}
  function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;el("toasts").appendChild(d);setTimeout(()=>d.remove(),4000);}
  function moveBadge(uid,rank){const p=prevRank[uid];if(p==null)return firstLoad?'<span class="same">·</span>':'<span class="newp">NEW</span>';if(p>rank)return `<span class="up">▲${p-rank}</span>`;if(p<rank)return `<span class="down">▼${rank-p}</span>`;return '<span class="same">·</span>';}

  // ── confetti ──
  const cvs=el("confetti"),ctx=cvs.getContext("2d");let parts=[],raf=null;
  function rz(){cvs.width=innerWidth;cvs.height=innerHeight;}rz();addEventListener("resize",rz);
  function burst(n=100){const cols=["#146C43","#B5D334","#E3BC45","#0E3B2C","#CE9765","#7A4FA8"];for(let i=0;i<n;i++)parts.push({x:innerWidth*(.3+Math.random()*.4),y:-20,vx:(Math.random()-.5)*9,vy:Math.random()*4+2,g:.16,s:6+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]});if(!raf)loop();}
  function loop(){ctx.clearRect(0,0,cvs.width,cvs.height);parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);ctx.restore();});parts=parts.filter(p=>p.y<cvs.height+30);if(parts.length)raf=requestAnimationFrame(loop);else{raf=null;ctx.clearRect(0,0,cvs.width,cvs.height);}}

  // ── static chrome (re-applied on language switch) ──
  function chrome(){
    document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
    el("h-kicker").textContent=T().kicker;el("h-title").textContent=T().title;el("h-live").textContent=T().live;
    el("lang").textContent=lang==="ar"?"English":"العربية";
    el("l-cap").textContent=T().cap;el("q").placeholder=T().searchPh;
    if(!booted){el("state").textContent=T().connecting;el("ticker").innerHTML=T().ticker({bt:"0",kg:"0",ph:"0",km:"0"})[0];}
  }

  // ── render ──
  function podSlot(rows,rank,rise){
    const r=rows[rank-1];if(!r)return"";
    const tied=rank>1&&r.points===rows[0].points;
    const st=pstats(r,rank);
    return `<div class="pod p${rank}${rise?' rise':''}" data-uid="${esc(r.uid)}">
      ${rank===1?`<div class="p-flag">${T().champFlag}</div>`:''}
      <div class="p-ava" style="background:${color(r.name)}">${initial(r.name)}</div>
      <div class="p-nm">${esc(r.name||"—")}</div>
      <div>${tierPill(r.points||0)}</div>
      <div class="p-pts">${fmt(r.points)}<small> ${T().pts}</small></div>
      <div class="p-sub">${T().bottlesLine(fmt(st.bottles),fmt(st.kg))}</div>
      ${tied?`<div class="p-tied">${T().tiedLeader}</div>`:''}
      <div class="p-block"><span>${rank}</span></div>
    </div>`;
  }
  function rowHtml(r,rank,rows,hit){
    const grew=!firstLoad&&prevPoints[r.uid]!=null&&r.points>prevPoints[r.uid];
    const st=pstats(r,rank);
    return `<div class="row ${grew?'flash':''} ${hit?'hit':''}" data-uid="${esc(r.uid)}">
      <div class="r-rank">${rank<=3?`<span class="disc d${rank}">${rank}</span>`:rank}</div>
      <div class="r-move">${moveBadge(r.uid,rank)}</div>
      <div class="r-ava" style="background:${color(r.name)}">${initial(r.name)}</div>
      <div class="r-main">
        <div class="r-top"><b>${esc(r.name||"—")}</b>${chipHtml(st)}</div>
        <div class="r-sub">${T().bottlesLine(fmt(st.bottles),fmt(st.kg))}</div>
      </div>
      <div class="r-pts">${fmt(r.points)}<small>${T().pts}</small></div>
    </div>`;
  }
  function renderRows(){
    const rows=lastRows;
    if(query){
      const q=query.toLowerCase();
      const hits=rows.map((r,i)=>({r,rank:i+1})).filter(x=>(x.r.name||"").toLowerCase().includes(q));
      el("rows").innerHTML=hits.length?hits.map(x=>rowHtml(x.r,x.rank,rows,true)).join(""):`<div class="empty">${T().noMatch}</div>`;
      return;
    }
    const rest=rows.slice(3);
    el("rows").innerHTML=rest.length?rest.map((r,i)=>rowHtml(r,i+4,rows,false)).join(""):`<div class="empty">${T().allPodium}</div>`;
  }
  function render(rows){
    if(!rows.length){el("state").style.display="block";el("main").style.display="none";el("state").textContent=T().noPlayers;return;}
    const sig=JSON.stringify(rows.map(r=>[r.uid,r.name,r.points,r.updatedAt]))+lang;
    if(sig===lastSig&&booted){lastUpdate=Date.now();return;}
    el("state").style.display="none";el("main").style.display="grid";

    if(!firstLoad){
      let earned=false;
      rows.forEach(r=>{const b=prevPoints[r.uid];if(b!=null&&r.points>b){toast(T().earnedT(first(r.name),fmt(r.points-b)));earned=true;}});
      if(earned)burst(90);
      if(rows[0]&&prevLeader&&rows[0].uid!==prevLeader){toast(T().leadT(first(rows[0].name)));burst(150);}
    }

    lastRows=rows;
    el("podium").innerHTML=podSlot(rows,2,!booted)+podSlot(rows,1,!booted)+podSlot(rows,3,!booted);

    const total=rows.reduce((a,r)=>a+(r.points||0),0),kg=Math.round(total*CO2_PER_POINT),bt=Math.round(total*BOTTLE_SHARE/POINTS_PER_BOTTLE);
    el("stats").innerHTML=`
      <div class="stat card"><div class="ic">${ICONS.users}</div><div style="min-width:0"><div class="v" id="s1">0</div><div class="l">${T().competing}</div></div></div>
      <div class="stat card"><div class="ic">${ICONS.bolt}</div><div style="min-width:0"><div class="v" id="s2">0</div><div class="l">${T().totalPts}</div></div></div>
      <div class="stat card"><div class="ic">${ICONS.bottle}</div><div style="min-width:0"><div class="v" id="s3">0</div><div class="l">${T().bottlesT}</div></div></div>
      <div class="stat card"><div class="ic">${ICONS.globe}</div><div style="min-width:0"><div class="v" id="s4">0</div><div class="l">${T().co2}</div></div></div>`;
    animateNum(el("s1"),rows.length);animateNum(el("s2"),total);animateNum(el("s3"),bt);animateNum(el("s4"),kg);
    tickerData=T().ticker({bt:fmt(bt),kg:fmt(kg),ph:fmt(kg*120),km:fmt(kg*6)});

    renderRows();
    if(sheetUid)fillSheet();

    prevPoints={};prevRank={};rows.forEach((r,i)=>{prevPoints[r.uid]=r.points;prevRank[r.uid]=i+1;});
    prevLeader=rows[0]?rows[0].uid:null;firstLoad=false;booted=true;lastSig=sig;lastUpdate=Date.now();el("updated").textContent=T().updatedNow;
  }

  // ── player sheet ──
  function fillSheet(){
    const i=lastRows.findIndex(r=>r.uid===sheetUid);
    if(i<0){closeSheet();return;}
    const r=lastRows[i],rank=i+1,t=tier(r.points||0),pr=progress(r.points||0),act=ago(r.updatedAt);
    const st=pstats(r,rank);
    const ladder=TIERS.map((x,xi)=>{
      const done=r.points>=(TIERS[xi+1]?TIERS[xi+1].min:Infinity);
      const cur=t===x;
      const fill=done?100:(cur?Math.max(6,pr.pct):0);
      return `<div class="lad-seg ${done?'done':''} ${cur?'cur':''}" title="${tname(x)}">
        <div class="bar"><i style="width:${fill}%;background:${x.c}"></i></div><span class="dot2" style="background:${x.c}"></span></div>`;
    }).join("");
    el("sheet").innerHTML=`
      <div class="sh-top">
        <div class="sh-ava" style="background:${color(r.name)}">${initial(r.name)}</div>
        <div class="sh-id"><b>${esc(r.name||"—")}</b><div style="margin-top:4px">${tierPill(r.points||0)} ${chipHtml(st)}</div></div>
        <button class="sh-x" id="sh-x">✕</button>
      </div>
      <div class="sh-grid">
        <div class="sh-cell"><div class="v">#${rank}</div><div class="l">${T().rank}</div></div>
        <div class="sh-cell"><div class="v" style="color:var(--green)">${fmt(r.points)}</div><div class="l">${T().points}</div></div>
        <div class="sh-cell"><div class="v" style="font-size:13px;line-height:2.1">${act||"—"}</div><div class="l">${T().lastActive}</div></div>
        <div class="sh-cell"><div class="v">${fmt(st.bottles)}</div><div class="l">${T().bottlesL}</div></div>
        <div class="sh-cell"><div class="v">${fmt(st.kg)}</div><div class="l">${T().co2L}</div></div>
        <div class="sh-cell"><div class="v" style="font-size:13px;line-height:2.1">${T().strengths[st.strength]}</div><div class="l">${T().strengthL}</div></div>
      </div>
      <div class="sh-cap">${T().journey}</div><div class="lad">${ladder}</div>
      <div class="sh-cap" style="margin-top:16px">${T().insightCap}</div>
      <div class="sh-insight">${T().insight(esc(first(r.name)),{vel:st.vel!=null?fmt(st.vel):null,bottles:fmt(st.bottles),kg:fmt(st.kg),km:fmt(st.kg*6)})}</div>`;
    el("sh-x").onclick=closeSheet;
  }
  function openSheet(uid){sheetUid=uid;fillSheet();el("ov").classList.add("open");}
  function closeSheet(){sheetUid=null;el("ov").classList.remove("open");}
  el("ov").onclick=e=>{if(e.target===el("ov"))closeSheet();};
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
  function delegate(container){el(container).addEventListener("click",e=>{let n=e.target;while(n&&n!==el(container)){if(n.dataset&&n.dataset.uid){openSheet(n.dataset.uid);return;}n=n.parentNode;}});}
  delegate("rows");delegate("podium");

  // ── search ──
  let qTimer=null;
  el("q").addEventListener("input",e=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=e.target.value.trim();renderRows();},140);});

  // ── language toggle ──
  el("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("psaux_lang",lang);}catch(e){}chrome();lastSig="";if(lastRows.length)render(lastRows);};

  // ── data: anonymous auth + Firestore REST (polled) ──
  async function auth(){
    const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:'{"returnSecureToken":true}'});
    if(!r.ok) throw new Error("auth "+r.status);
    idToken=(await r.json()).idToken;
  }
  function parseDoc(d){const f=d.fields||{};const S=k=>(f[k]&&f[k].stringValue)||"";const N=k=>f[k]?parseInt(f[k].integerValue||Math.round(f[k].doubleValue||0)):0;const TS=k=>S(k)||(f[k]&&f[k].timestampValue)||"";return{uid:(d.name||"").split("/").pop(),name:S("name"),points:N("points"),level:S("level"),updatedAt:TS("updatedAt"),createdAt:TS("createdAt")};}
  async function fetchUsers(){
    if(!idToken) await auth();
    const url=`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/users?pageSize=100`;
    let r=await fetch(url,{headers:{Authorization:"Bearer "+idToken}});
    if(r.status===401){await auth();r=await fetch(url,{headers:{Authorization:"Bearer "+idToken}});}
    if(!r.ok) throw new Error("read "+r.status);
    const rows=((await r.json()).documents||[]).map(parseDoc);
    rows.sort((a,b)=>(b.points||0)-(a.points||0));
    return rows.slice(0,20);
  }
  async function tick(){
    try{ render(await fetchUsers()); fails=0; }
    catch(e){ fails++; console.error(e);
      if(firstLoad||fails>=3){ el("main").style.display="none"; const s=el("state"); s.style.display="block";
        s.innerHTML=T().cantReach+"<small>"+T().cantReachSub+" ("+esc(e.message||"error")+")</small>"; }
    }
  }

  // ── chrome: clock, updated-ago, ticker, fullscreen ──
  function clockTick(){el("clock").textContent=new Date().toLocaleTimeString(lang==="ar"?"ar-SA":[],{hour:"2-digit",minute:"2-digit"});}
  chrome();clockTick();tick();
  setInterval(tick,POLL_MS);setInterval(clockTick,15e3);
  setInterval(()=>{if(!lastUpdate)return;const s=Math.floor((Date.now()-lastUpdate)/1000);el("updated").textContent=s<3?T().updatedNow:(s<60?T().updatedS(s):T().updatedM(Math.floor(s/60)));},1000);
  setInterval(()=>{if(!tickerData.length)return;tickIdx=(tickIdx+1)%tickerData.length;const t=el("ticker");t.classList.remove("show");setTimeout(()=>{t.innerHTML=tickerData[tickIdx];t.classList.add("show");},380);},6500);
  el("fs").onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else d.requestFullscreen&&d.requestFullscreen();};
</script>
</body>
</html>
