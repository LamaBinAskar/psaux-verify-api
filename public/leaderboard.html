<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSAUx — Eco Champions Leaderboard</title>
<style>
  :root{--green:#0F5A3E;--green-l:#12694a;--green-d:#062a1d;--gold:#E7C349;--gold-d:#C9A227;--ink-2:rgba(255,255,255,.62);--ink-3:rgba(255,255,255,.42)}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  html,body{height:100%}
  body{background:radial-gradient(130% 120% at 50% -10%,#17805a 0%,var(--green) 42%,var(--green-d) 100%);color:#fff;min-height:100vh;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:-40%;background:radial-gradient(40% 30% at 18% 18%,rgba(231,195,73,.10),transparent 60%),radial-gradient(40% 30% at 82% 26%,rgba(255,255,255,.06),transparent 60%);animation:drift 22s ease-in-out infinite alternate;z-index:0}
  @keyframes drift{to{transform:translate3d(4%,3%,0) rotate(3deg)}}
  #leaves{position:fixed;inset:0;z-index:0;pointer-events:none}
  #confetti{position:fixed;inset:0;z-index:40;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:24px 30px 26px;min-height:100vh;display:flex;flex-direction:column}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:15px}
  .brand img{height:58px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4))}
  .brand .k{font-size:11.5px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-2);font-weight:700}
  .brand h2{font-size:31px;font-weight:900;line-height:1.05;background:linear-gradient(90deg,#fff,#ffe9a8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .brand .ar{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:2px}
  .hright{display:flex;align-items:center;gap:10px}
  .pill{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);padding:9px 15px;border-radius:30px;font-weight:800;font-size:14px;letter-spacing:1px}
  .clock{font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .dot{width:11px;height:11px;border-radius:50%;background:#54e59a;box-shadow:0 0 0 0 rgba(84,229,154,.7);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(84,229,154,.6)}70%{box-shadow:0 0 0 15px rgba(84,229,154,0)}100%{box-shadow:0 0 0 0 rgba(84,229,154,0)}}
  .fs{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:18px;cursor:pointer}
  .fs:hover{background:rgba(255,255,255,.2)}
  .updated{position:absolute;top:86px;right:30px;font-size:12px;color:var(--ink-3);font-weight:600}

  .main{display:grid;grid-template-columns:1.2fr .95fr;gap:22px;flex:1;min-height:0}
  @media (max-width:900px){.main{grid-template-columns:1fr}}

  /* ── Podium ── */
  .arena{display:flex;flex-direction:column;min-height:0}
  .podium{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:12px 8px 0;min-height:0}
  .pod{display:flex;flex-direction:column;align-items:center;text-align:center;width:31%;min-width:0}
  .pod .p-crown{font-size:34px;margin-bottom:2px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-7px)}}
  .p-ava{width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#fff;border:4px solid rgba(255,255,255,.85);box-shadow:0 12px 30px rgba(0,0,0,.4);margin-bottom:9px}
  .p1 .p-ava{width:112px;height:112px;font-size:46px;border-color:var(--gold);box-shadow:0 0 0 6px rgba(231,195,73,.25),0 14px 36px rgba(0,0,0,.45);animation:glow 2.6s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 0 12px rgba(231,195,73,.14),0 14px 36px rgba(0,0,0,.45)}}
  .p-nm{font-size:19px;font-weight:900;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p1 .p-nm{font-size:24px}
  .tier{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;margin-top:5px}
  .p-pts{font-size:27px;font-weight:900;color:#ffe9a8;margin:7px 0 10px;line-height:1;font-variant-numeric:tabular-nums}
  .p1 .p-pts{font-size:36px}
  .p-pts small{font-size:12px;color:var(--ink-2);font-weight:700}
  .p-tied{font-size:11.5px;font-weight:800;color:#ffe9a8;margin:-6px 0 8px}
  .p-block{position:relative;width:100%;border-radius:14px 14px 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.18);border-bottom:none}
  .p1 .p-block{height:132px;background:linear-gradient(180deg,rgba(231,195,73,.42),rgba(201,162,39,.10));border-color:rgba(231,195,73,.5)}
  .p2 .p-block{height:96px;background:linear-gradient(180deg,rgba(210,220,235,.30),rgba(210,220,235,.06))}
  .p3 .p-block{height:76px;background:linear-gradient(180deg,rgba(205,137,80,.32),rgba(205,137,80,.07))}
  .p-block span{font-size:44px;font-weight:900;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
  .p1 .p-block span{font-size:58px;color:rgba(255,255,255,.65)}
  .p1 .p-block::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:shine 5.5s ease-in-out infinite}
  @keyframes shine{12%{transform:translateX(120%)}100%{transform:translateX(120%)}}
  .rise .p-block{animation:rise .8s cubic-bezier(.2,1.1,.35,1) backwards;transform-origin:bottom}
  .rise .p-ava,.rise .p-nm{animation:fadeup .7s ease .25s backwards}
  @keyframes rise{from{transform:scaleY(0)}}
  @keyframes fadeup{from{opacity:0;transform:translateY(10px)}}
  .floor{height:10px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);margin:0 6px}

  .stats{display:flex;gap:12px;margin-top:14px}
  .stat{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:11px}
  .stat .ic{font-size:22px}
  .stat .v{font-size:23px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:11px;color:var(--ink-2);font-weight:600;margin-top:2px}

  /* ── Chase list ── */
  .list{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:8px;overflow:auto;min-height:0;display:flex;flex-direction:column}
  .list .cap{font-size:11px;letter-spacing:2px;font-weight:800;color:rgba(255,255,255,.5);padding:8px 14px 6px;display:flex;justify-content:space-between}
  .row{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:14px}
  .row+.row{margin-top:2px}
  .row.flash{animation:flash 2.4s ease-out}
  @keyframes flash{0%{background:rgba(231,195,73,.5)}100%{background:transparent}}
  .r-rank{width:30px;text-align:center;font-weight:900;font-size:19px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
  .r-move{width:28px;font-size:12.5px;font-weight:800;text-align:center}
  .up{color:#54e59a}.down{color:#ff8f8f}.same{color:rgba(255,255,255,.28)}.newp{color:var(--gold)}
  .r-ava{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;flex:0 0 auto;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .r-main{flex:1;min-width:0}
  .r-top{display:flex;align-items:center;gap:8px;min-width:0}
  .r-top b{font-size:17.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-ago{font-size:11px;color:var(--ink-3);font-weight:600;white-space:nowrap}
  .meter{height:6px;border-radius:4px;background:rgba(255,255,255,.12);margin:7px 0 5px;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:4px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
  .r-sub{font-size:11.5px;color:rgba(255,255,255,.55);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-pts{font-weight:900;font-size:21px;color:#ffe9a8;font-variant-numeric:tabular-nums}
  .r-pts small{font-size:11px;color:var(--ink-3);font-weight:700;margin-left:3px}
  .list .empty{padding:26px 16px;text-align:center;color:var(--ink-2);font-weight:600;font-size:14px}

  footer{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--ink-2);font-size:13.5px;font-weight:600}
  .ticker{flex:1;min-width:0;font-size:15px;font-weight:800;color:#fff;opacity:0;transition:opacity .35s}
  .ticker.show{opacity:1}
  .ticker small{font-weight:600;color:var(--ink-3)}
  .qr{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 12px}
  .qr img{width:58px;height:58px;border-radius:8px;background:#fff;padding:4px}
  .qr .t{font-size:12px;line-height:1.3}.qr .t b{color:#ffe9a8;font-size:13px}
  .state{text-align:center;padding:70px 20px;color:rgba(255,255,255,.85);font-size:19px;font-weight:700}
  .state small{display:block;margin-top:12px;font-weight:500;font-size:14px;color:rgba(255,255,255,.55);max-width:560px;margin:12px auto 0;line-height:1.5}

  #toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
  .toast{background:linear-gradient(90deg,var(--gold),var(--gold-d));color:#3a2e00;font-weight:900;font-size:18px;padding:13px 22px;border-radius:30px;box-shadow:0 12px 34px rgba(0,0,0,.35);animation:tpop .35s cubic-bezier(.2,1.3,.4,1),tout .4s ease 3.4s forwards}
  @keyframes tpop{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-14px) scale(.96)}}

  @media (max-width:900px){
    .brand h2{font-size:24px}.brand .ar{font-size:12px}.clock{display:none}.updated{display:none}
    .podium{gap:10px}.p-ava{width:64px;height:64px;font-size:26px}.p1 .p-ava{width:84px;height:84px;font-size:34px}
    .p-nm{font-size:15px}.p1 .p-nm{font-size:19px}.p-pts{font-size:21px}.p1 .p-pts{font-size:27px}
    .p1 .p-block{height:96px}.p2 .p-block{height:70px}.p3 .p-block{height:56px}
    .stats{flex-wrap:wrap}.stat{flex:1 1 44%}footer{flex-direction:column}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<canvas id="leaves"></canvas>
<canvas id="confetti"></canvas>
<div id="toasts"></div>
<div class="updated" id="updated"></div>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="/emblem.png" alt="PSAUx" onerror="this.style.display='none'"/>
      <div>
        <div class="k">Prince Sattam University · Sustainability</div>
        <h2>Eco Champions</h2>
        <div class="ar">لوحة صدارة الاستدامة · مباشر</div>
      </div>
    </div>
    <div class="hright">
      <div class="pill clock" id="clock"></div>
      <div class="pill"><span class="dot"></span> LIVE</div>
      <button class="fs" id="fs" title="Fullscreen">⛶</button>
    </div>
  </header>

  <div class="main" id="main" style="display:none">
    <div class="arena">
      <div class="podium" id="podium"></div>
      <div class="floor"></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div id="state" class="state">Connecting to the campus leaderboard…</div>

  <footer>
    <div class="ticker show" id="ticker">⚡ Earn Eco-points at any PSAUx station, in the app, and by volunteering.</div>
    <div class="qr" id="qr"></div>
  </footer>
</div>

<script>
  // ── Reads Firestore over plain REST (no realtime SDK / no CDN) so it works on
  //    any network Google is reachable from; polls every few seconds. ──
  const KEY="AIzaSyDTZ4COIWrzmXZtC9uAsAUCNwHALOquvMM", PROJECT="psaux-26";
  const CO2_PER_POINT=0.05, POLL_MS=4000;
  const PAL=[["#2E9E6B","#1c6e49"],["#1E8E7E","#125e55"],["#D99A00","#a37200"],["#CB6B3A","#9c4d26"],["#6C4FBF","#4a3388"],["#0A97D9","#0a6ea0"],["#C0397B","#8e2359"],["#3E7C3A","#2a5a27"],["#0f8a8a","#0a5f5f"],["#B0842E","#7d5d18"]];
  const TIERS=[{min:0,n:"Active Contributor",e:"🌱",c:"#7bd66a"},{min:500,n:"Green Achiever",e:"🍃",c:"#35c7b0"},{min:1500,n:"Sustainability Advocate",e:"🌿",c:"#3fb984"},{min:3000,n:"Campus Changemaker",e:"🌍",c:"#57b8e8"},{min:5000,n:"PSAUx Champion",e:"🏅",c:"#E7C349"},{min:8000,n:"Sustainability Legend",e:"💎",c:"#b388ff"}];
  let prevPoints={},prevRank={},firstLoad=true,booted=false,lastSig="",lastUpdate=0,prevLeader=null,idToken=null,fails=0,tickerData=[],tickIdx=0;

  const el=id=>document.getElementById(id);
  const initial=n=>((n||"?").trim().charAt(0)||"?").toUpperCase();
  const first=n=>(n||"Explorer").trim().split(" ")[0];
  const esc=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt=n=>(n||0).toLocaleString("en-US");
  function grad(name){let h=0;const s=(name||"?");for(let i=0;i<s.length;i++)h=(h*33+s.charCodeAt(i))>>>0;const p=PAL[h%PAL.length];return `linear-gradient(135deg,${p[0]},${p[1]})`;}
  function tier(p){let t=TIERS[0];for(const x of TIERS)if(p>=x.min)t=x;return t;}
  function tierPill(p){const t=tier(p);return `<span class="tier" style="background:${t.c}26;color:${t.c}">${t.e} ${t.n}</span>`;}
  function progress(p){const i=TIERS.findIndex(t=>p<t.min);if(i<0)return{pct:100,label:"💎 Top tier — Sustainability Legend"};const lo=TIERS[i-1].min,hi=TIERS[i].min;return{pct:Math.max(4,Math.round((p-lo)/(hi-lo)*100)),label:`${fmt(hi-p)} pts → ${TIERS[i].n} ${TIERS[i].e}`};}
  function ago(iso){if(!iso)return"";const s=(Date.now()-Date.parse(iso))/1e3;if(!(s>=0))return"";if(s<90)return"active now";if(s<3600)return`active ${Math.floor(s/60)}m ago`;if(s<86400)return`active ${Math.floor(s/3600)}h ago`;return`active ${Math.floor(s/86400)}d ago`;}
  function animateNum(node,to){if(!node)return;const from=parseInt((node.textContent||"0").replace(/,/g,""))||0;if(from===to){node.textContent=fmt(to);return;}const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/650);node.textContent=fmt(Math.round(from+(to-from)*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(s);})(t0);}
  function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;el("toasts").appendChild(d);setTimeout(()=>d.remove(),4000);}
  function moveBadge(uid,rank){const p=prevRank[uid];if(p==null)return firstLoad?'<span class="same">·</span>':'<span class="newp">NEW</span>';if(p>rank)return `<span class="up">▲${p-rank}</span>`;if(p<rank)return `<span class="down">▼${rank-p}</span>`;return '<span class="same">·</span>';}

  // ── confetti ──
  const cvs=el("confetti"),ctx=cvs.getContext("2d");let parts=[],raf=null;
  function rz(){cvs.width=innerWidth;cvs.height=innerHeight;}rz();addEventListener("resize",rz);
  function burst(n=100){const cols=["#E7C349","#54e59a","#fff","#12694a","#C9A227","#b388ff"];for(let i=0;i<n;i++)parts.push({x:innerWidth*(.3+Math.random()*.4),y:-20,vx:(Math.random()-.5)*9,vy:Math.random()*4+2,g:.16,s:6+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]});if(!raf)loop();}
  function loop(){ctx.clearRect(0,0,cvs.width,cvs.height);parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);ctx.restore();});parts=parts.filter(p=>p.y<cvs.height+30);if(parts.length)raf=requestAnimationFrame(loop);else{raf=null;ctx.clearRect(0,0,cvs.width,cvs.height);}}

  // ── ambient leaves ──
  const lv=el("leaves"),lctx=lv.getContext("2d");
  function lrz(){lv.width=innerWidth;lv.height=innerHeight;}lrz();addEventListener("resize",lrz);
  const LCOL=["rgba(231,195,73,.13)","rgba(84,229,154,.11)","rgba(255,255,255,.07)","rgba(123,214,106,.10)"];
  const leaves=Array.from({length:14},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:7+Math.random()*9,ph:Math.random()*6.28,sp:.2+Math.random()*.45,rot:Math.random()*3,vr:(Math.random()-.5)*.01,c:LCOL[Math.floor(Math.random()*LCOL.length)]}));
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
    (function lloop(t){lctx.clearRect(0,0,lv.width,lv.height);leaves.forEach(p=>{p.y+=p.sp;p.x+=Math.sin(t/1600+p.ph)*.35;p.rot+=p.vr;if(p.y>lv.height+20){p.y=-20;p.x=Math.random()*lv.width;}lctx.save();lctx.translate(p.x,p.y);lctx.rotate(p.rot);lctx.fillStyle=p.c;lctx.beginPath();lctx.ellipse(0,0,p.s,p.s*.42,0,0,6.29);lctx.fill();lctx.restore();});requestAnimationFrame(lloop);})(0);
  }

  // ── render ──
  function podSlot(rows,rank,rise){
    const r=rows[rank-1];if(!r)return"";
    const tied=rank>1&&r.points===rows[0].points;
    return `<div class="pod p${rank}${rise?' rise':''}">
      ${rank===1?'<div class="p-crown">👑</div>':''}
      <div class="p-ava" style="background:${grad(r.name)}">${initial(r.name)}</div>
      <div class="p-nm">${esc(r.name||"Explorer")}</div>
      <div>${tierPill(r.points||0)}</div>
      <div class="p-pts">${fmt(r.points)}<small> pts</small></div>
      ${tied?'<div class="p-tied">🤝 tied with the leader</div>':''}
      <div class="p-block"><span>${rank}</span></div>
    </div>`;
  }
  function render(rows){
    if(!rows.length){el("state").style.display="block";el("main").style.display="none";el("state").textContent="No players yet — be the first to earn Eco-points!";return;}
    const sig=JSON.stringify(rows.map(r=>[r.uid,r.name,r.points,r.updatedAt]));
    if(sig===lastSig&&booted){lastUpdate=Date.now();return;}
    el("state").style.display="none";el("main").style.display="grid";

    if(!firstLoad){
      let earned=false;
      rows.forEach(r=>{const b=prevPoints[r.uid];if(b!=null&&r.points>b){toast(`🎉 ${first(r.name)} earned +${fmt(r.points-b)} pts!`);earned=true;}});
      if(earned)burst(90);
      if(rows[0]&&prevLeader&&rows[0].uid!==prevLeader){toast(`👑 ${first(rows[0].name)} takes the lead!`);burst(150);}
    }

    el("podium").innerHTML=podSlot(rows,2,!booted)+podSlot(rows,1,!booted)+podSlot(rows,3,!booted);

    const total=rows.reduce((a,r)=>a+(r.points||0),0),kg=Math.round(total*CO2_PER_POINT);
    el("stats").innerHTML=`
      <div class="stat"><div class="ic">👥</div><div><div class="v" id="s1">0</div><div class="l">Competing</div></div></div>
      <div class="stat"><div class="ic">⚡</div><div><div class="v" id="s2">0</div><div class="l">Total Eco-points</div></div></div>
      <div class="stat"><div class="ic">🌍</div><div><div class="v" id="s3">0</div><div class="l">kg CO₂ saved (est.)</div></div></div>`;
    animateNum(el("s1"),rows.length);animateNum(el("s2"),total);animateNum(el("s3"),kg);
    tickerData=[
      "⚡ Earn Eco-points at any PSAUx station, in the app, and by volunteering.",
      `🌍 Together the campus has saved ≈ ${fmt(kg)} kg of CO₂ <small>· est.</small>`,
      `📱 That's the clean energy of ≈ ${fmt(kg*120)} phone charges`,
      `🚗 Or ≈ ${fmt(kg*6)} km NOT driven by car`,
      `🌳 Equal to ≈ ${fmt(kg*17)} days of one tree at work for the campus`,
      "♻️ Every bottle counts — scan, sort, climb the board!"];

    const rest=rows.slice(3);
    el("list").innerHTML='<div class="cap"><span>THE CHASE</span><span>الترتيب</span></div>'+(rest.length?rest.map((r,i)=>{
      const rank=i+4,above=rows[rank-2],gap=above.points-r.points,grew=!firstLoad&&prevPoints[r.uid]!=null&&r.points>prevPoints[r.uid];
      const pr=progress(r.points||0),t=tier(r.points||0),act=ago(r.updatedAt);
      return `<div class="row ${grew?'flash':''}">
        <div class="r-rank">${rank}</div>
        <div class="r-move">${moveBadge(r.uid,rank)}</div>
        <div class="r-ava" style="background:${grad(r.name)}">${initial(r.name)}</div>
        <div class="r-main">
          <div class="r-top"><b>${esc(r.name||"Explorer")}</b>${tierPill(r.points||0)}${act?`<span class="r-ago">· ${act}</span>`:''}</div>
          <div class="meter"><i style="width:${pr.pct}%;background:${t.c}"></i></div>
          <div class="r-sub">${pr.label} · ${gap===0?`🤝 tied with ${esc(first(above.name))}`:`▲ ${fmt(gap)} to catch ${esc(first(above.name))}`}</div>
        </div>
        <div class="r-pts">${fmt(r.points)}<small>pts</small></div>
      </div>`;
    }).join(""):'<div class="empty">🏆 Everyone\'s on the podium — scan the QR and join the chase!</div>');

    prevPoints={};prevRank={};rows.forEach((r,i)=>{prevPoints[r.uid]=r.points;prevRank[r.uid]=i+1;});
    prevLeader=rows[0]?rows[0].uid:null;firstLoad=false;booted=true;lastSig=sig;lastUpdate=Date.now();el("updated").textContent="Updated just now";
  }

  // ── data: anonymous auth + Firestore REST (polled) ──
  async function auth(){
    const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:'{"returnSecureToken":true}'});
    if(!r.ok) throw new Error("auth "+r.status);
    idToken=(await r.json()).idToken;
  }
  function parseDoc(d){const f=d.fields||{};const S=k=>(f[k]&&f[k].stringValue)||"";const N=k=>f[k]?parseInt(f[k].integerValue||Math.round(f[k].doubleValue||0)):0;return{uid:(d.name||"").split("/").pop(),name:S("name"),points:N("points"),level:S("level"),updatedAt:S("updatedAt")||(f.updatedAt&&f.updatedAt.timestampValue)||""};}
  async function fetchUsers(){
    if(!idToken) await auth();
    const url=`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/users?pageSize=100`;
    let r=await fetch(url,{headers:{Authorization:"Bearer "+idToken}});
    if(r.status===401){await auth();r=await fetch(url,{headers:{Authorization:"Bearer "+idToken}});}
    if(!r.ok) throw new Error("read "+r.status);
    const rows=((await r.json()).documents||[]).map(parseDoc);
    rows.sort((a,b)=>(b.points||0)-(a.points||0));
    return rows.slice(0,20);
  }
  async function tick(){
    try{ render(await fetchUsers()); fails=0; }
    catch(e){ fails++; console.error(e);
      if(firstLoad||fails>=3){ el("main").style.display="none"; const s=el("state"); s.style.display="block";
        s.innerHTML="Couldn't reach the leaderboard.<small>Check the network connection. If it persists, confirm Firestore allows reading <b>users</b> for signed-in clients. ("+esc(e.message||"error")+")</small>"; }
    }
  }
  tick(); setInterval(tick,POLL_MS);

  // ── chrome: clock, updated-ago, ticker, fullscreen, QR ──
  function clock(){el("clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
  clock();setInterval(clock,15e3);
  setInterval(()=>{if(!lastUpdate)return;const s=Math.floor((Date.now()-lastUpdate)/1000);el("updated").textContent=s<3?"Updated just now":(s<60?`Updated ${s}s ago`:`Updated ${Math.floor(s/60)}m ago`);},1000);
  setInterval(()=>{if(!tickerData.length)return;tickIdx=(tickIdx+1)%tickerData.length;const t=el("ticker");t.classList.remove("show");setTimeout(()=>{t.innerHTML=tickerData[tickIdx];t.classList.add("show");},380);},6500);
  el("fs").onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else d.requestFullscreen&&d.requestFullscreen();};
  const here=encodeURIComponent(location.href.split('#')[0]);
  el("qr").innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&margin=0&data=${here}" alt="QR" onerror="this.parentNode.style.display='none'"><div class="t"><b>Scan to view</b><br>on your phone</div>`;
</script>
</body>
