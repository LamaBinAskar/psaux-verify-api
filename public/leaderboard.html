<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#F4F7F4" />
<title>PSAUx Campus Forest — Live</title>
<link rel="icon" href="/emblem.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Palette + type from the PSAUxLONDON app (AppColors: passport green,
     antique gold, ledger surfaces; fontFamily: PlusJakartaSans). */
  :root{--ff:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --paper:#F4F7F4;--card:#FFFFFF;--line:#E2E8F0;--line-2:#D0DCD4;
    --ink:#1A1C1E;--ink2:#5A6B5E;--ink3:#9AA59C;
    --green:#0F5A3E;--green-d:#0B3D2E;--green-t:#EEF3EE;
    --amber:#C5A35A;--amber-d:#705D00;--amber-t:#F5EFDD;--amber-b:#E3D2A4;--r:20px}
  [dir=rtl]{--ff:"IBM Plex Sans Arabic","Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;font-family:var(--ff)}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(90% 55% at 50% -8%,rgba(15,90,62,.06),transparent 70%)}
  #confetti{position:fixed;inset:0;z-index:60;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:20px 26px 22px;min-height:100vh;display:flex;flex-direction:column}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(26,28,30,.04),0 10px 28px rgba(26,28,30,.06)}
  svg{display:block}

  /* ── header ── */
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .brand img{height:50px}
  .brand .k{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--green);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [dir=rtl] .brand .k{letter-spacing:0}
  .brand h2{font-size:28px;font-weight:800;line-height:1.08;color:var(--green-d);letter-spacing:-.5px;white-space:nowrap}
  [dir=rtl] .brand h2{letter-spacing:0}
  .hright{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:9px 14px;border-radius:30px;font-weight:600;font-size:13.5px;color:var(--ink)}
  .clock{font-variant-numeric:tabular-nums}
  .dot{width:9px;height:9px;border-radius:50%;background:#1F9D55;box-shadow:0 0 0 0 rgba(31,157,85,.5);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,85,.45)}70%{box-shadow:0 0 0 12px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
  .ctrl{height:40px;border-radius:30px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;padding:0 14px;transition:background .15s,transform .15s}
  .ctrl:hover{background:#E8EDE8}
  .ctrl:active{transform:scale(.96)}
  .ctrl.icon{width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  .updated{position:absolute;top:78px;inset-inline-end:26px;font-size:12px;color:var(--ink3);font-weight:500;z-index:2}

  .main{display:flex;flex-direction:column;gap:16px;flex:1;min-height:0}
  .bottom{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;flex:1;min-height:0}
  .side{display:flex;flex-direction:column;gap:12px;min-height:0}
  @media (max-width:940px){.bottom{grid-template-columns:1fr}}

  /* ── forest scene ── */
  .forest{overflow:hidden;display:flex;flex-direction:column;min-height:0;padding:0}
  .forest .cap{padding:13px 18px 9px}
  .forest .tt{font-size:14px;letter-spacing:0;color:var(--ink2);font-weight:700}
  #scene{line-height:0}
  #scene svg{width:100%;height:auto}
  .cap{display:flex;align-items:center;gap:10px}
  .cap .tt{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--ink3)}
  [dir=rtl] .cap .tt{letter-spacing:0}

  /* scene animation layers */
  .cloud{animation:drift linear infinite}
  @keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(1700px)}}
  .tw{animation:tw ease-in-out infinite}
  @keyframes tw{50%{opacity:.15}}
  .turb{animation:turb 8s linear infinite}
  @keyframes turb{to{transform:rotate(360deg)}}
  .fw{animation:fw ease-in-out infinite}
  @keyframes fw{50%{opacity:.15;transform:translateY(-6px)}}
  .fly{animation:fly linear infinite}
  @keyframes fly{from{transform:translate(-60px,0)}to{transform:translate(1660px,-40px)}}
  .flut{animation:flut .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  @keyframes flut{from{transform:scaleX(1)}to{transform:scaleX(.45)}}
  .tree{cursor:pointer}
  .tree .body{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--sw,4s) ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
  .tree.grow .body{animation:grow .9s cubic-bezier(.2,1.25,.4,1) backwards,sway var(--sw,4s) ease-in-out 1s infinite alternate}
  @keyframes grow{from{transform:scaleY(0)}}
  .tree:hover .body,.tree.lit .body{filter:brightness(1.12) drop-shadow(0 0 6px rgba(197,163,90,.55))}
  .tree.cheer .body{animation:cheer .5s ease 4 alternate}
  @keyframes cheer{to{transform:scale(1.06) rotate(1deg)}}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{min-width:0;padding:14px 16px;display:flex;align-items:center;gap:12px;border-radius:16px}
  .stat .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--green-t);color:var(--green);flex:0 0 auto}
  .stat .v{font-size:27px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:11.5px;color:var(--ink2);font-weight:600;margin-top:4px}
  .msg{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px 22px;min-height:86px}
  .msg .ticker{font-size:20px;font-weight:700;color:var(--green-d);line-height:1.5;opacity:0;transition:opacity .35s}
  .msg .ticker.show{opacity:1}
  .msg .ticker small{font-weight:600;color:var(--ink3);font-size:14px}
  .msg .ticker .alt{font-size:14px;color:var(--ink3);font-weight:600;margin-top:7px}

  /* ── ranking list ── */
  .list{padding:10px;overflow:hidden;min-height:0;display:flex;flex-direction:column}
  .list .cap{padding:6px 8px 10px}
  #rows{overflow:auto;flex:1;min-height:0}
  .row{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:15px;cursor:pointer;transition:background .15s,transform .15s;border:1px solid transparent}
  .row:hover{background:#F1F5F1;transform:translateY(-1px)}
  .row:active{transform:scale(.99)}
  .row+.row{margin-top:3px}
  .row.flash{animation:flash 2.4s ease-out}
  .row.in{animation:rowin .5s cubic-bezier(.2,.9,.3,1) backwards}
  @keyframes rowin{from{opacity:0;transform:translateY(10px)}}
  .row.spot{border-color:var(--amber-b);background:#F9F4E4}
  @keyframes flash{0%{background:var(--amber-t)}100%{background:transparent}}
  .r-rank{width:34px;display:flex;justify-content:center;font-weight:700;font-size:19px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .disc{width:31px;height:31px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(26,28,30,.2)}
  .d1{background:linear-gradient(180deg,#E9C349,#AF8D11)}
  .d2{background:linear-gradient(180deg,#BFC6CE,#98A2AD)}
  .d3{background:linear-gradient(180deg,#CBA24C,#A9832F)}
  .r-move{width:26px;font-size:12px;font-weight:700;text-align:center;flex:0 0 auto}
  .up{color:#1F7A3D}.down{color:#C0402A}.same{color:#C9C2AE}.newp{color:var(--amber)}
  .r-ava{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#fff;flex:0 0 auto}
  .r-main{flex:1;min-width:0}
  .r-top{display:flex;align-items:center;gap:10px;min-width:0}
  .r-top b{font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pbar{height:9px;border-radius:5px;background:#EDF1ED;margin-top:8px;overflow:hidden}
  .pbar i{display:block;height:100%;border-radius:5px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
  .r-col{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto}
  [dir=rtl] .r-col{align-items:flex-start}
  .r-gap{font-size:12.5px;font-weight:700;color:var(--amber-d);white-space:nowrap}
  .r-gap.tie{color:var(--ink3)}
  .chip{font-size:10.5px;font-weight:700;color:var(--green);background:var(--green-t);border-radius:20px;padding:3px 9px;white-space:nowrap;flex:0 0 auto}
  /* head-to-head duel module (#1 vs #2) */
  .race{margin:0 4px 10px;background:var(--card);border:1px solid var(--amber-b);border-radius:16px;padding:12px 14px;display:none;flex-direction:column;gap:9px}
  .duel-top{display:flex;align-items:center;gap:12px}
  .duel-side{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
  .duel-side.b{flex-direction:row-reverse;text-align:end}
  .duel-ava{width:44px;height:44px;border-radius:14px;color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .duel-nm{min-width:0}
  .duel-nm b{display:block;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .duel-nm span{font-size:15px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
  .duel-vs{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--amber-t);border:1px solid var(--amber-b);color:var(--amber-d);font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center}
  .duel-vs.tie{animation:vspulse 1.6s ease-in-out infinite}
  @keyframes vspulse{50%{transform:scale(1.14);box-shadow:0 0 0 7px rgba(197,163,90,.18)}}
  .duel-bar{height:10px;border-radius:6px;background:#DDE3E9;overflow:hidden}
  .duel-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#E9C349,#C5A35A);transition:width .8s cubic-bezier(.2,.9,.3,1)}
  .duel-note{font-size:13.5px;font-weight:700;color:var(--amber-d);text-align:center}
  .hot{display:inline-flex;flex:0 0 auto}
  .pico{width:58%;height:58%}
  .r-ava,.duel-ava,.sh-ava{box-shadow:inset 0 -7px 12px rgba(10,30,20,.16),inset 0 5px 9px rgba(255,255,255,.16),0 3px 8px rgba(26,28,30,.14)}
  .duel-bar{position:relative}
  .duel-bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:rgba(26,28,30,.28);border-radius:1px}
  .r-pts{font-weight:800;font-size:23px;color:var(--ink);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .r-pts small{font-size:12px;color:var(--ink3);font-weight:600;margin-inline-start:3px}
  .tier{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
  .empty{padding:26px 16px;text-align:center;color:var(--ink2);font-weight:500;font-size:14px}

  /* ── player sheet ── */
  #ov{position:fixed;inset:0;z-index:50;background:rgba(24,32,26,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  #ov.open{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:22px 24px 28px;box-shadow:0 -18px 50px rgba(24,32,26,.25);animation:sheetup .32s cubic-bezier(.2,1.05,.35,1)}
  @keyframes sheetup{from{transform:translateY(60px);opacity:0}}
  @media (min-width:940px){#ov{align-items:center}.sheet{border-radius:24px;border-bottom:1px solid var(--line);animation:sheetpop .28s cubic-bezier(.2,1.1,.35,1)}@keyframes sheetpop{from{transform:scale(.95);opacity:0}}}
  .sh-top{display:flex;align-items:center;gap:15px}
  .sh-ava{width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;flex:0 0 auto}
  .sh-id{flex:1;min-width:0}
  .sh-id b{font-size:22px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sh-x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#EEF3EE;color:var(--ink2);font-size:14px;cursor:pointer;flex:0 0 auto}
  .sh-x:hover{background:#E8EDE8}
  .sh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
  .sh-cell{background:#F3F6F3;border:1px solid var(--line);border-radius:15px;padding:11px 12px;text-align:center}
  .sh-cell .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .sh-cell .l{font-size:10.5px;color:var(--ink2);font-weight:600;margin-top:3px}
  .sh-cap{font-size:11px;letter-spacing:1.6px;font-weight:700;color:var(--ink3);margin-bottom:9px}
  [dir=rtl] .sh-cap{letter-spacing:0}
  .lad{display:flex;gap:5px}
  .lad-seg{flex:1;text-align:center}
  .lad-seg .bar{height:7px;border-radius:4px;background:#E6ECE7;overflow:hidden}
  .lad-seg .bar i{display:block;height:100%;border-radius:4px}
  .dot2{display:inline-block;width:9px;height:9px;border-radius:50%;margin-top:7px;opacity:.3}
  .lad-seg.done .dot2,.lad-seg.cur .dot2{opacity:1}
  .lad-seg.cur .dot2{transform:scale(1.45)}
  .sh-insight{margin-top:16px;background:var(--green-t);border:1px solid var(--line-2);border-radius:15px;padding:13px 15px;font-size:13.5px;line-height:1.55;color:var(--green-d);font-weight:500}

  /* ── footer ── */
  footer{margin-top:14px;display:flex;align-items:center;gap:16px;font-size:13.5px}
  .ticker{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);opacity:0;transition:opacity .35s;text-align:center}
  .ticker.show{opacity:1}
  .ticker small{font-weight:500;color:var(--ink3)}
  .state{text-align:center;padding:70px 20px;color:var(--ink2);font-size:19px;font-weight:600}
  .state small{display:block;margin-top:12px;font-weight:400;font-size:14px;color:var(--ink3);max-width:560px;margin:12px auto 0;line-height:1.5}

  #toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
  .toast{background:#002114;color:#EBD498;font-weight:600;font-size:16.5px;padding:13px 22px;border-radius:30px;box-shadow:0 12px 34px rgba(24,32,26,.3);animation:tpop .35s cubic-bezier(.2,1.3,.4,1),tout .4s ease 3.4s forwards}
  @keyframes tpop{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-14px) scale(.96)}}

  @media (max-width:940px){
    .brand h2{font-size:21px}.brand .k{font-size:9.5px}.clock{display:none}.updated{display:none}
    .stats{flex-wrap:wrap}.stat{flex:1 1 44%}
  }
  /* ── big-screen mode: everything larger for projectors / lobby TVs ── */
  @media (min-width:1500px){
    .wrap{max-width:1560px}
    .brand h2{font-size:36px}.brand .k{font-size:13px}
    .brand img{height:60px}
    .pill{font-size:16px;padding:11px 17px}
    .forest .tt{font-size:18px}
    .cap .tt{font-size:13px}
    .race{padding:15px 18px}
    .duel-ava{width:54px;height:54px;font-size:22px}
    .duel-nm b{font-size:23px}
    .duel-nm span{font-size:19px}
    .duel-vs{width:50px;height:50px;font-size:16px}
    .duel-bar{height:14px}
    .duel-note{font-size:17px}
    .row{padding:16px 17px}
    .r-rank{width:42px;font-size:23px}
    .disc{width:38px;height:38px;font-size:18px}
    .r-move{width:32px;font-size:15px}
    .r-ava{width:56px;height:56px;font-size:23px}
    .r-top b{font-size:24px}
    .tier{font-size:13.5px;padding:4px 12px}
    .pbar{height:12px;margin-top:10px}
    .r-pts{font-size:30px}
    .r-pts small{font-size:15px}
    .r-gap{font-size:16px}
    .stat{padding:17px 19px}
    .stat .ic{width:52px;height:52px;border-radius:15px}
    .stat .ic svg{width:22px;height:22px}
    .stat .v{font-size:36px}
    .stat .l{font-size:13.5px;margin-top:5px}
    .msg{min-height:110px;padding:22px 26px}
    .msg .ticker{font-size:27px}
    .msg .ticker .alt{font-size:18px;margin-top:9px}
    .empty{font-size:17px}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="confetti"></canvas>
<div id="toasts"></div>
<div class="updated" id="updated"></div>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="/emblem.png" alt="PSAUx" onerror="this.style.display='none'"/>
      <div style="min-width:0">
        <div class="k" id="h-kicker"></div>
        <h2 id="h-title"></h2>
      </div>
    </div>
    <div class="hright">
      <div class="pill clock" id="clock"></div>
      <div class="pill"><span class="dot"></span> <span id="h-live"></span></div>
      <button class="ctrl" id="lang"></button>
      <button class="ctrl icon" id="fs" title="Fullscreen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    </div>
  </header>

  <div class="main" id="main" style="display:none">
    <div class="forest card">
      <div class="cap"><span class="tt" id="f-cap"></span></div>
      <div id="scene"></div>
    </div>
    <div class="bottom">
      <div class="list card">
        <div class="cap"><span class="tt" id="l-cap"></span></div>
        <div class="race" id="race"></div>
        <div id="rows"></div>
      </div>
      <div class="side">
        <div class="stats" id="stats"></div>
        <div class="msg card"><div class="ticker show" id="ticker"></div></div>
      </div>
    </div>
  </div>
  <div id="state" class="state"></div>
</div>

<div id="ov"><div class="sheet" id="sheet"></div></div>

<script>
  // ── Reads Firestore over plain REST (no realtime SDK / no CDN) so it works on
  //    any network Google is reachable from; polls every few seconds. ──
  const KEY="AIzaSyDTZ4COIWrzmXZtC9uAsAUCNwHALOquvMM", PROJECT="psaux-26";
  const CO2_PER_POINT=0.05, POLL_MS=4000;
  // Bottle model: the PSAUx app awards 2 pts per scanned bottle; assume ~70% of
  // a player's points come from bottle scans (rest: challenges, volunteering).
  const POINTS_PER_BOTTLE=2, BOTTLE_SHARE=0.7;
  const PAL=["#3E7C50","#2E7D74","#B08900","#B15E36","#6D5CA8","#2C6E9E","#A8447C","#587A33","#0F7E7E","#8A6D3B"];
  const TIERS=[
    {min:0,n:"Active Contributor",ar:"المساهم النشط",c:"#5D8A3C"},
    {min:500,n:"Green Achiever",ar:"المنجز الأخضر",c:"#2E8B6A"},
    {min:1500,n:"Sustainability Advocate",ar:"مناصر الاستدامة",c:"#0F7E7E"},
    {min:3000,n:"Campus Changemaker",ar:"صانع التغيير",c:"#2C6E9E"},
    {min:5000,n:"PSAUx Champion",ar:"بطل PSAUx",c:"#A9832F"},
    {min:8000,n:"Sustainability Legend",ar:"أسطورة الاستدامة",c:"#7A4FA8"}];

          [[0,0],[4.4,3.2],[-4.4,3.2],[2.2,7],[-2.2,7],[0,10.5]].forEach(o=>{body+=`<circle cx="${(bx+o[0]).toFixed(1)}" cy="${(by+o[1]).toFixed(1)}" r="3.3" fill="#E9C349" stroke="#A9832F" stroke-width=".8"/>`;});});
      }

        body+=`<circle cx="${bend.toFixed(1)}" cy="${(-H-FL*.05).toFixed(1)}" r="${(FL*1.05).toFixed(1)}" fill="none" stroke="#E9C349" stroke-width="1.4" opacity=".5" stroke-dasharray="3 6"/>`;
      }
    }
    const BT=H+FL*.48;
    const badge=rank<=3?`${crowned?`<path class="crown" d="M-13 ${(-(BT+36)).toFixed(1)} L-7.5 ${(-(BT+50)).toFixed(1)} L0 ${(-(BT+40.5)).toFixed(1)} L7.5 ${(-(BT+50)).toFixed(1)} L13 ${(-(BT+36)).toFixed(1)} Z" fill="#E9C349" stroke="#A9832F" stroke-width="1"/>`:""}
      <circle cx="0" cy="${(-(BT+18)).toFixed(1)}" r="14.5" fill="${rank===1?"#E9C349":rank===2?"#B4BDC6":"#CBA24C"}" stroke="${rank===1?"#A9832F":rank===2?"#8D97A3":"#A9832F"}" stroke-width="1.3"/>
      <text x="0" y="${(-(BT+12.5)).toFixed(1)}" text-anchor="middle" font-size="15.5" font-weight="800" fill="#fff">${rank}</text>`:"";
    return `<g class="tree${growIn}${grewNow}" data-uid="${esc(r.uid)}" transform="translate(${x.toFixed(1)},${baseY})" style="--sw:${sway}">
      <ellipse cx="0" cy="3" rx="${Math.max(14,FL*.85).toFixed(1)}" ry="5" fill="rgba(10,40,28,.16)"/>
      <g class="body">${body}${badge}</g>
      <rect x="-52" y="11" width="104" height="40" rx="7" fill="#8A6A45" stroke="#6B4E32" stroke-width="1"/>
      <text x="0" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#F6EFDF">${nm}</text>
      <text x="0" y="45" text-anchor="middle" font-size="15.5" font-weight="800" fill="#EBD498">${fmt(r.points)}</text>
    </g>`;
  }

  function sceneSvg(rows){
    const mode=skyMode(),S=SKY[mode],W=1600;
    const shown=rows.slice(0,12);
    const n=shown.length,spacing=Math.min(200,(W-180)/Math.max(1,n));
    // rank 1 in the middle, others fanning outwards; top 3 stand on podium mounds.
    // A tie at the top crowns (and lifts) both leaders equally.
    const tiedTop=shown[1]&&shown[0]&&shown[1].points===shown[0].points;
    const moundLift=r=>r===1?20:r===2?(tiedTop?20:13):r===3?8:0;
    const placed=shown.map((r,i)=>{
      const off=Math.ceil(i/2)*(i%2?-1:1);
      const jitter=(hash(r.uid)%25)-12;
      return {r,rank:i+1,x:W/2+off*spacing+jitter};
    });
    const mounds=placed.filter(t=>t.rank<=3).map(t=>{
      const rx=t.rank===1||(t.rank===2&&tiedTop)?88:t.rank===2?72:60,ry=moundLift(t.rank)+10;
      return `<ellipse class="mound" cx="${t.x.toFixed(1)}" cy="412" rx="${rx}" ry="${ry}" fill="${S.mound}"/>`;
    }).join("");
    const trees=placed.sort((a,b)=>a.x-b.x).map(t=>treeSvg(t.r,t.rank,t.x,408-moundLift(t.rank),t.rank===1||(t.rank===2&&tiedTop))).join("");

    // empty reserved plots just beyond the grove — "your tree here!"
    let plots="";
    for(let k=0;k<2&&shown.length+k<12;k++){
      const i=shown.length+k,off=Math.ceil(i/2)*(i%2?-1:1),px=W/2+off*spacing;
      if(px<80||px>W-80)break;
      if(px>1270&&px<1510)continue; // keep the pond clear
      plots+=`<g opacity=".9">
        <ellipse cx="${px.toFixed(1)}" cy="410" rx="34" ry="8" fill="none" stroke="${S.tuft}" stroke-width="1.6" stroke-dasharray="5 5"/>
        <path d="M${px} 408 Q${px} 401 ${px} 396 M${px} 401 Q${(px-5).toFixed(1)} 397 ${(px-8).toFixed(1)} 396 M${px} 401 Q${(px+5).toFixed(1)} 397 ${(px+8).toFixed(1)} 396" stroke="${S.tuft}" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="${(px-52).toFixed(1)}" y="419" width="104" height="26" rx="7" fill="none" stroke="#8A6A45" stroke-width="1.7" stroke-dasharray="6 4"/>
        <text x="${px.toFixed(1)}" y="437" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8A6A45">${T().plotSign}</text>
      </g>`;
    }

    const total=rows.reduce((a,r)=>a+(r.points||0),0);
    const flowers=Math.min(34,Math.round(total*BOTTLE_SHARE/POINTS_PER_BOTTLE/120));
    let flora="";
    for(let i=0;i<flowers;i++){
      const fx=30+(i*211)%(W-60),fy=436+(i*53)%22,fc=["#E9C349","#F6EFDF","#CBA24C"][i%3];
      if(fx>1280&&fx<1500)continue; // keep the pond clear
      flora+=`<g><line x1="${fx}" y1="${fy+6}" x2="${fx}" y2="${fy}" stroke="#4C8A3F" stroke-width="1.4"/>
        <g fill="${fc}"><circle cx="${fx-2.2}" cy="${fy-2}" r="1.6"/><circle cx="${fx+2.2}" cy="${fy-2}" r="1.6"/><circle cx="${fx}" cy="${fy-4.2}" r="1.6"/><circle cx="${fx}" cy="${fy+.2}" r="1.6"/></g>
        <circle cx="${fx}" cy="${fy-2}" r="1.7" fill="${fc==="#F6EFDF"?"#E9C349":"#F6EFDF"}"/></g>`;
    }

    // sustainability landmarks: wind turbine on the ridge, oasis pond,
    // and a PSAUx recycling station in the meadow
    const hub=256;
    const turbine=`<g opacity="${mode==="night"?".6":".92"}">
      <path d="M229.4 318 L231 ${hub} L233 ${hub} L234.6 318 Z" fill="${S.turb}"/>
      <g transform="translate(232,${hub})"><g class="turb">
        <path d="M0 0 L3 -27 L-3 -27 Z" fill="${S.turb}"/>
        <path d="M0 0 L3 -27 L-3 -27 Z" fill="${S.turb}" transform="rotate(120)"/>
        <path d="M0 0 L3 -27 L-3 -27 Z" fill="${S.turb}" transform="rotate(240)"/>
      </g></g>
      <circle cx="232" cy="${hub}" r="3.2" fill="${S.turb}"/></g>`;
    const pond=`<g><ellipse cx="1385" cy="437" rx="94" ry="17" fill="${S.waterR}"/>
      <ellipse cx="1385" cy="437" rx="80" ry="13" fill="${S.water}"/>
      <path d="M1352 434 h 20 M1396 441 h 15" stroke="#FFFFFF" stroke-width="1.6" opacity="${mode==="night"?".15":".5"}" stroke-linecap="round"/></g>`;
    const station=`<g>
      <rect x="101" y="391" width="40" height="7" rx="3" fill="#14563A"/>
      <rect x="104" y="396" width="34" height="27" rx="4" fill="#1F7A4D" stroke="#14563A" stroke-width="1"/>
      <g transform="translate(121,410)" stroke="#FFFFFF" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-2.6 -7 h 5.2 M-2.6 -7 v 2.1 c 0 .5 -1.7 1.2 -1.7 2.6 V 4 a 1.7 1.7 0 0 0 1.7 1.7 h 5.2 A 1.7 1.7 0 0 0 4.3 4 V -2.3 c 0 -1.4 -1.7 -2.1 -1.7 -2.6 V -7"/>
      </g>
      <text x="121" y="437" text-anchor="middle" font-size="9.5" font-weight="700" fill="${S.tuft}">PSAUx</text></g>`;

    // the sun / moon travel across the sky with the real local time
    const nowM=new Date().getHours()*60+new Date().getMinutes();
    let sky="";
    if(mode==="night"){
      const nf=Math.min(1,Math.max(0,((nowM>=1140?nowM-1140:nowM+300))/660));
      const mx=140+nf*(W-280),my=115-Math.sin(nf*Math.PI)*55;
      sky+=`<circle cx="${mx.toFixed(0)}" cy="${my.toFixed(0)}" r="26" fill="#EAF0E2"/><circle cx="${(mx+12).toFixed(0)}" cy="${(my-8).toFixed(0)}" r="24" fill="${S.top}"/>`;
      for(let i=0;i<20;i++){const sx=(i*311)%W,sy=18+(i*67)%120;
        sky+=`<circle class="tw" cx="${sx}" cy="${sy}" r="${1+(i%3)*.5}" fill="#EAF0DC" style="animation-duration:${2+(i%4)}s;animation-delay:${(i%5)*.6}s"/>`;}
      for(let i=0;i<10;i++){const fx=140+(i*181)%(W-280),fy=330+(i*37)%70;
        sky+=`<circle class="fw" cx="${fx}" cy="${fy}" r="2" fill="#E9C349" style="animation-duration:${2.4+(i%3)}s;animation-delay:${(i%4)*.7}s"/>`;}
    }else{
      const sf=Math.min(1,Math.max(0,(nowM-330)/840));
      const sx=110+sf*(W-220),sy=205-Math.sin(sf*Math.PI)*140;
      sky+=`<circle cx="${sx.toFixed(0)}" cy="${sy.toFixed(0)}" r="52" fill="#F7D774" opacity=".28"/><circle cx="${sx.toFixed(0)}" cy="${sy.toFixed(0)}" r="32" fill="${mode==="day"?"#F7D774":"#F2B95C"}"/>`;
      sky+=`<g class="cloud" style="animation-duration:85s"><ellipse cx="0" cy="70" rx="46" ry="15" fill="#fff" opacity=".65"/><ellipse cx="34" cy="62" rx="30" ry="12" fill="#fff" opacity=".65"/></g>
        <g class="cloud" style="animation-duration:120s;animation-delay:-50s"><ellipse cx="0" cy="130" rx="56" ry="16" fill="#fff" opacity=".5"/><ellipse cx="40" cy="122" rx="32" ry="12" fill="#fff" opacity=".5"/></g>
        <g class="cloud" style="animation-duration:150s;animation-delay:-95s"><ellipse cx="0" cy="42" rx="34" ry="10" fill="#fff" opacity=".4"/></g>
        <g class="fly" style="animation-duration:42s"><g class="flut"><ellipse cx="-4" cy="150" rx="5" ry="3.4" fill="#C5A35A"/><ellipse cx="4" cy="150" rx="5" ry="3.4" fill="#E9C349"/></g></g>
        <g class="fly" style="animation-duration:60s;animation-delay:-25s">
          <path d="M0 100 q7 -8 14 0 q7 -8 14 0" stroke="#5A6B5E" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M26 114 q6 -7 12 0 q6 -7 12 0" stroke="#5A6B5E" stroke-width="1.7" fill="none" stroke-linecap="round"/>
          <path d="M-20 124 q5 -6 10 0 q5 -6 10 0" stroke="#5A6B5E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </g>`;
    }

    // horizon depth: distant palm grove, desert dune band, arch monument,
    // grass tufts, and corner bushes framing the composition
    let farGrove="";
    for(let i=0;i<9;i++){const fx=(80+i*181)%W,fy=340+(i*29)%14,fs=.5+(i%3)*.18;farGrove+=farPalm(fx,fy,fs,S.sil);}
    const ax=W*.86;
    const arch=`<g fill="${S.mon}" opacity=".55"><path d="M${ax-30} 350 v-34 a30 30 0 0 1 60 0 v34 h-11 v-32 a19 19 0 0 0 -38 0 v32 Z"/></g>`;
    const dune=`<path d="M0 354 Q400 338 820 352 T1600 346 L1600 470 L0 470 Z" fill="${S.dune}"/>`;
    let tufts="";
    for(let i=0;i<12;i++){const tx=40+(i*233)%(W-80),ty=424+(i*61)%36;
      tufts+=`<path d="M${tx} ${ty} q-2 -6 -4.5 -8 M${tx} ${ty} q0 -7 0 -9.5 M${tx} ${ty} q2 -6 4.5 -8" stroke="${S.tuft}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;}
    const bushes=`<g fill="${S.bush}"><circle cx="-14" cy="474" r="62"/><circle cx="46" cy="482" r="44"/><circle cx="${W+14}" cy="474" r="62"/><circle cx="${W-46}" cy="482" r="44"/></g>`;

    return `<svg viewBox="0 0 ${W} 470" preserveAspectRatio="xMidYMax meet" role="img">
      <defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${S.top}"/><stop offset="1" stop-color="${S.bot}"/></linearGradient></defs>
      <rect width="${W}" height="470" fill="url(#skyg)"/>
      ${sky}
      <path d="M0 330 Q270 268 570 314 T1150 304 T1600 320 L1600 470 L0 470 Z" fill="${S.hillB}"/>
      ${arch}
      ${dune}
      ${farGrove}
      ${turbine}
      <path d="M0 372 Q350 328 770 360 T1600 356 L1600 470 L0 470 Z" fill="${S.hillF}"/>
      <rect y="408" width="${W}" height="62" fill="${S.grass}"/>
      ${pond}
      ${station}
      ${mounds}
      ${flora}
      ${tufts}
      ${plots}
      ${trees}
      ${bushes}
      ${S.overlay?`<rect width="${W}" height="470" fill="#04140D" opacity="${S.overlay}"/>`:""}
    </svg>`;
  }

  // ── render ──
  function rowHtml(r,rank){
    const grew=!firstLoad&&prevPoints[r.uid]!=null&&r.points>prevPoints[r.uid];
    const t=tier(r.points||0),lead=lastRows[0]?lastRows[0].points||0:0;
    const pct=lead>0?Math.max(2,Math.round((r.points||0)/lead*100)):(rank===1?100:2);
    const above=rank>1?lastRows[rank-2]:null,gap=above?above.points-r.points:0;
    const gapHtml=above?(gap===0?`<div class="r-gap tie">${T().tie}</div>`:`<div class="r-gap">▲ ${fmt(gap)}</div>`):"";
    const hot=r.updatedAt&&(Date.now()-Date.parse(r.updatedAt))<1728e5?`<span class="hot" title="${T().hotT}"><svg width="14" height="14" viewBox="0 0 24 24" fill="#D97E2B"><path d="M12 2C14.2 6.2 8.5 8 8.5 12.6a3.5 3.5 0 0 0 7 .3C17.8 9 14.2 6.8 12 2z"/></svg></span>`:"";
    return `<div class="row ${grew?'flash':''} ${booted?'':'in'}" style="animation-delay:${booted?0:Math.min(rank*45,500)}ms" data-uid="${esc(r.uid)}">
      <div class="r-rank">${rank<=3?`<span class="disc d${rank}">${rank}</span>`:rank}</div>
      <div class="r-move">${moveBadge(r.uid,rank)}</div>
      <div class="r-ava" style="background:${color(r.name)}">${avatar(r.name)}</div>
      <div class="r-main">
        <div class="r-top"><b>${esc(r.name||"—")}</b>${tierPill(r.points||0)}${hot}</div>
        <div class="pbar"><i style="width:${pct}%;background:${t.c}"></i></div>
      </div>
      <div class="r-col"><div class="r-pts">${fmt(r.points)}<small>${T().pts}</small></div>${gapHtml}</div>
    </div>`;
  }
  // The duel card cycles through ALL adjacent pairs (with the spotlight), so
  // every student appears on screen with a personal push — not just the top 2.
  function renderDuel(i){
    const rows=lastRows;if(!rows[1])return;
    if(i<1||i>=rows.length)i=0;
    const A=i===0?rows[0]:rows[i-1],B=i===0?rows[1]:rows[i];
    const gap=A.points-B.points,a=esc(first(A.name)),b=esc(first(B.name));
    const share=(A.points+B.points)>0?Math.round(A.points/(A.points+B.points)*100):50;
    const note=i===0
      ?(gap===0?T().raceTied(a,b,fmt(A.points)):T().defend(a,fmt(A.points)))
      :`${b} — ${gap===0?T().tiedWith(a):T().catchUp(fmt(gap),a)} · ${T().cheer[i%T().cheer.length]}`;
    el("race").innerHTML=`
      <div class="duel-top">
        <div class="duel-side"><div class="duel-ava" style="background:${color(A.name)}">${avatar(A.name)}</div><div class="duel-nm"><b>${esc(A.name||"—")}</b><span>${fmt(A.points)}</span></div></div>
        <div class="duel-vs ${gap===0?'tie':''}">${T().vs}</div>
        <div class="duel-side b"><div class="duel-ava" style="background:${color(B.name)}">${avatar(B.name)}</div><div class="duel-nm"><b>${esc(B.name||"—")}</b><span>${fmt(B.points)}</span></div></div>
      </div>
      <div class="duel-bar"><i style="width:${share}%"></i></div>
      <div class="duel-note">${note}</div>`;
  }
  function renderRows(){
    const cont=el("rows");
    cont.innerHTML=lastRows.map((r,i)=>rowHtml(r,i+1)).join("");
    // FLIP: rows that changed rank glide from their old position to the new one
    if(firstLoad||!cont.querySelectorAll)return;
    const kids=cont.querySelectorAll(".row");
    let rowH=0;
    kids.forEach((k,i)=>{
      if(!rowH&&k.offsetHeight)rowH=k.offsetHeight+3;
      const r0=prevRank[k.dataset.uid],r1=i+1;
      if(r0&&r0!==r1&&rowH){
        k.style.transition="none";k.style.transform=`translateY(${(r0-r1)*rowH}px)`;
        requestAnimationFrame(()=>{requestAnimationFrame(()=>{
          k.style.transition="transform .7s cubic-bezier(.2,.9,.3,1)";k.style.transform="";});});
      }
    });
  }
  function render(rows){
    if(!rows.length){el("state").style.display="block";el("main").style.display="none";el("state").textContent=T().noPlayers;return;}
    const sig=JSON.stringify(rows.map(r=>[r.uid,r.name,r.points,r.updatedAt]))+lang;
    if(sig===lastSig&&booted){lastUpdate=Date.now();return;}
    el("state").style.display="none";el("main").style.display="grid";

    gained=new Set();
    if(!firstLoad){
      rows.forEach(r=>{const b=prevPoints[r.uid];if(b!=null&&r.points>b){toast(T().earnedT(first(r.name),fmt(r.points-b)));gained.add(r.uid);}});
      if(gained.size)burst(90);
      if(rows[0]&&prevLeader&&rows[0].uid!==prevLeader){toast(T().leadT(first(rows[0].name)));burst(150);}
    }

    lastRows=rows;
    el("scene").innerHTML=sceneSvg(rows);

    const total=rows.reduce((a,r)=>a+(r.points||0),0),kg=Math.round(total*CO2_PER_POINT),bt=Math.round(total*BOTTLE_SHARE/POINTS_PER_BOTTLE);
    el("stats").innerHTML=`
      <div class="stat card"><div class="ic">${ICONS.users}</div><div style="min-width:0"><div class="v" id="s1">0</div><div class="l">${T().competing}</div></div></div>
      <div class="stat card"><div class="ic">${ICONS.bolt}</div><div style="min-width:0"><div class="v" id="s2">0</div><div class="l">${T().totalPts}</div></div></div>
      <div class="stat card"><div class="ic">${ICONS.bottle}</div><div style="min-width:0"><div class="v" id="s3">0</div><div class="l">${T().bottlesT}</div></div></div>
      <div class="stat card"><div class="ic">${ICONS.globe}</div><div style="min-width:0"><div class="v" id="s4">0</div><div class="l">${T().co2}</div></div></div>`;
    animateNum(el("s1"),rows.length);animateNum(el("s2"),total);animateNum(el("s3"),bt);animateNum(el("s4"),kg);
    const z={bt:fmt(bt),kg:fmt(kg),ph:fmt(kg*120),km:fmt(kg*6)};
    const tEn=I18N.en.ticker(z),tAr=I18N.ar.ticker(z);
    tickerData=tEn.map((m,i)=>({en:m,ar:tAr[i]}));

    // rotating duel: everyone gets featured vs the player just above them
    if(rows[1]){
      el("race").style.display="flex";
      renderDuel(spotIdx>0&&spotIdx<rows.length?spotIdx:0);
      let bi=1,bg=Infinity;
      for(let i=1;i<rows.length;i++){const g=rows[i-1].points-rows[i].points;if(g<bg){bg=g;bi=i;}}
      const x=esc(first(rows[bi-1].name)),y=esc(first(rows[bi].name));
      tickerData.push({
        en:bg===0?I18N.en.battleTied(x,y):I18N.en.battle(x,y,fmt(bg)),
        ar:bg===0?I18N.ar.battleTied(x,y):I18N.ar.battle(x,y,fmt(bg))});
    }else{el("race").style.display="none";}

    renderRows();
    if(sheetUid)fillSheet();

    prevPoints={};prevRank={};rows.forEach((r,i)=>{prevPoints[r.uid]=r.points;prevRank[r.uid]=i+1;});
    prevLeader=rows[0]?rows[0].uid:null;firstLoad=false;booted=true;lastSig=sig;lastUpdate=Date.now();el("updated").textContent=T().updatedNow;
  }

  // ── player sheet ──
  function fillSheet(){
    const i=lastRows.findIndex(r=>r.uid===sheetUid);
    if(i<0){closeSheet();return;}
    const r=lastRows[i],rank=i+1,t=tier(r.points||0),pr=progress(r.points||0),act=ago(r.updatedAt);
    const st=pstats(r);
    const ladder=TIERS.map((x,xi)=>{
      const done=r.points>=(TIERS[xi+1]?TIERS[xi+1].min:Infinity);
      const cur=t===x;
      const fill=done?100:(cur?Math.max(6,pr.pct):0);
      return `<div class="lad-seg ${done?'done':''} ${cur?'cur':''}" title="${tname(x)}">
        <div class="bar"><i style="width:${fill}%;background:${x.c}"></i></div><span class="dot2" style="background:${x.c}"></span></div>`;
    }).join("");
    el("sheet").innerHTML=`
      <div class="sh-top">
        <div class="sh-ava" style="background:${color(r.name)}">${avatar(r.name)}</div>
        <div class="sh-id"><b>${esc(r.name||"—")}</b><div style="margin-top:4px">${tierPill(r.points||0)} ${chipHtml(st)}</div></div>
        <button class="sh-x" id="sh-x">✕</button>
      </div>
      <div class="sh-grid">
        <div class="sh-cell"><div class="v">#${rank}</div><div class="l">${T().rank}</div></div>
        <div class="sh-cell"><div class="v" style="color:var(--green)">${fmt(r.points)}</div><div class="l">${T().points}</div></div>
        <div class="sh-cell"><div class="v" style="font-size:13px;line-height:2.1">${act||"—"}</div><div class="l">${T().lastActive}</div></div>
        <div class="sh-cell"><div class="v">${fmt(st.bottles)}</div><div class="l">${T().bottlesL}</div></div>
        <div class="sh-cell"><div class="v">${fmt(st.kg)}</div><div class="l">${T().co2L}</div></div>
        <div class="sh-cell"><div class="v" style="font-size:13px;line-height:2.1">${T().strengths[st.strength]}</div><div class="l">${T().strengthL}</div></div>
      </div>
      <div class="sh-cap">${T().journey}</div><div class="lad">${ladder}</div>
      <div class="sh-cap" style="margin-top:16px">${T().insightCap}</div>
      <div class="sh-insight">${T().insight(esc(first(r.name)),{vel:st.vel!=null?fmt(st.vel):null,bottles:fmt(st.bottles),kg:fmt(st.kg),km:fmt(st.kg*6)})}</div>
      <div class="sh-cap" style="margin-top:16px">${T().raceCap}</div>
      <div class="sh-insight" style="background:var(--amber-t);border-color:var(--amber-b);color:var(--amber-d)">${(()=>{
        const parts=[];
        const above=rank>1?lastRows[rank-2]:null;
        parts.push(above?(above.points===r.points?T().tiedWith(esc(first(above.name))):T().catchUp(fmt(above.points-r.points),esc(first(above.name)))):T().front);
        const below=lastRows[rank];
        if(below)parts.push(T().behindYou(esc(first(below.name)),fmt(r.points-below.points)));
        return parts.join(" · ");
      })()}</div>`;
    el("sh-x").onclick=closeSheet;
  }
  function openSheet(uid){sheetUid=uid;fillSheet();el("ov").classList.add("open");}
  function closeSheet(){sheetUid=null;el("ov").classList.remove("open");}
  el("ov").onclick=e=>{if(e.target===el("ov"))closeSheet();};
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
  function findUid(node,container){let n=node;while(n&&n!==container){if(n.dataset&&n.dataset.uid)return n.dataset.uid;n=n.parentNode;}return null;}
  el("rows").addEventListener("click",e=>{const u=findUid(e.target,el("rows"));if(u)openSheet(u);});
  el("scene").addEventListener("click",e=>{const u=findUid(e.target,el("scene"));if(u)openSheet(u);else burst(24);});

  // hover sync: list row <-> its tree in the forest (both directions)
  el("rows").addEventListener("mouseover",e=>{const u=findUid(e.target,el("rows"));if(!u)return;const t=el("scene").querySelector(`[data-uid="${u}"]`);if(t)t.classList.add("lit");});
  el("rows").addEventListener("mouseout",e=>{const u=findUid(e.target,el("rows"));if(!u)return;const t=el("scene").querySelector(`[data-uid="${u}"]`);if(t)t.classList.remove("lit");});
  el("scene").addEventListener("mouseover",e=>{const u=findUid(e.target,el("scene"));if(!u)return;const r=el("rows").querySelector(`[data-uid="${u}"]`);if(r)r.classList.add("spot");});
  el("scene").addEventListener("mouseout",e=>{const u=findUid(e.target,el("scene"));if(!u)return;const r=el("rows").querySelector(`[data-uid="${u}"]`);if(r)r.classList.remove("spot");});

  // kiosk spotlight: every 8s, softly feature the next player (tree + row),
  // pausing while the sheet is open or right after someone touches the screen
  let spotIdx=-1,spotUid=null,lastTouch=0;
  function clearSpot(){
    if(!spotUid)return;
    const r=el("rows").querySelector(`[data-uid="${spotUid}"]`);if(r)r.classList.remove("spot");
    const t=el("scene").querySelector(`[data-uid="${spotUid}"]`);if(t)t.classList.remove("lit");
    spotUid=null;
  }
  setInterval(()=>{
    if(!booted||!lastRows.length||sheetUid)return;
    if(Date.now()-lastTouch<15e3)return;
    clearSpot();
    spotIdx=(spotIdx+1)%lastRows.length;
    spotUid=lastRows[spotIdx].uid;
    const r=el("rows").querySelector(`[data-uid="${spotUid}"]`);
    if(r){r.classList.add("spot");if(r.scrollIntoView)r.scrollIntoView({block:"nearest",behavior:"smooth"});}
    const t=el("scene").querySelector(`[data-uid="${spotUid}"]`);if(t)t.classList.add("lit");
    renderDuel(spotIdx);
  },8000);
  addEventListener("pointerdown",()=>{lastTouch=Date.now();clearSpot();},true);

  // ── language toggle ──
  el("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("psaux_lang",lang);}catch(e){}chrome();lastSig="";if(lastRows.length)render(lastRows);};

  // ── data: anonymous auth + Firestore REST (polled) ──
  async function auth(){
    const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:'{"returnSecureToken":true}'});
    if(!r.ok) throw new Error("auth "+r.status);
    idToken=(await r.json()).idToken;
  }
  function parseDoc(d){const f=d.fields||{};const S=k=>(f[k]&&f[k].stringValue)||"";const N=k=>f[k]?parseInt(f[k].integerValue||Math.round(f[k].doubleValue||0)):0;const TS=k=>S(k)||(f[k]&&f[k].timestampValue)||"";return{uid:(d.name||"").split("/").pop(),name:S("name"),points:N("points"),level:S("level"),updatedAt:TS("updatedAt"),createdAt:TS("createdAt")};}
  async function fetchUsers(){
    if(!idToken) await auth();
    const url=`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/users?pageSize=100`;
    let r=await fetch(url,{headers:{Authorization:"Bearer "+idToken}});
    if(r.status===401){await auth();r=await fetch(url,{headers:{Authorization:"Bearer "+idToken}});}
    if(!r.ok) throw new Error("read "+r.status);
    const rows=((await r.json()).documents||[]).map(parseDoc);
    rows.sort((a,b)=>(b.points||0)-(a.points||0));
    return rows.slice(0,20);
  }
  async function tick(){
    try{ render(await fetchUsers()); fails=0; }
    catch(e){ fails++; console.error(e);
      if(firstLoad||fails>=3){ el("main").style.display="none"; const s=el("state"); s.style.display="block";
        s.innerHTML=T().cantReach+"<small>"+T().cantReachSub+" ("+esc(e.message||"error")+")</small>"; }
    }
  }

  // ── chrome: clock, updated-ago, ticker, fullscreen, hourly sky refresh ──
  function clockTick(){el("clock").textContent=new Date().toLocaleTimeString(lang==="ar"?"ar-SA":[],{hour:"2-digit",minute:"2-digit"});}
  chrome();clockTick();tick();
  setInterval(tick,POLL_MS);setInterval(clockTick,15e3);
  setInterval(()=>{if(booted&&lastRows.length)el("scene").innerHTML=sceneSvg(lastRows);},18e5); // sky follows the clock
  setInterval(()=>{if(!lastUpdate)return;const s=Math.floor((Date.now()-lastUpdate)/1000);el("updated").textContent=s<3?T().updatedNow:(s<60?T().updatedS(s):T().updatedM(Math.floor(s/60)));},1000);
  setInterval(()=>{if(!tickerData.length)return;tickIdx=(tickIdx+1)%tickerData.length;const t=el("ticker");t.classList.remove("show");setTimeout(()=>{t.innerHTML=tickHtml(tickerData[tickIdx]);t.classList.add("show");},380);},6500);
  el("fs").onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else d.requestFullscreen&&d.requestFullscreen();};
</script>
</body>
</html>
